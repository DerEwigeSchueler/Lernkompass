let ki={thema:'',n:9,mix:'ausgewogen',zeit:45,fall:true,src:[],ck:{},ok:false};
/* Material-Check: Selbstbestätigung vor dem Prompt-Generator. Wird nicht gespeichert, gilt nur für diesen Besuch. */
const KSRC=[['mitschrift','Meine eigene Mitschrift oder eigene Notizen'],['lehrkraft','Skript, Folien oder Arbeitsblatt einer Lehrkraft'],['buch','Lehrbuch oder Fachartikel'],['praxis','Etwas aus der Praxis (z. B. Pflegedokumentation, Übergabe)']];
const KCK=[['daten','Mein Material enthält <b>keine Patientendaten</b>, keine echten Namen und nichts aus der Pflegedokumentation.',()=>true],
 ['ueben','Ich nutze die Probeklausur <b>nur zum Üben</b> – nicht in einer Prüfung oder für eine bewertete Arbeit.',()=>true],
 ['regeln','Ich halte mich an die <b>KI-Regeln meiner Schule</b>. Wenn ich unsicher bin, frage ich nach.',()=>true],
 ['erlaubt','Die Lehrkraft, von der das Material stammt, hat mir <b>erlaubt</b>, es in eine KI zu geben.',()=>ki.src.includes('lehrkraft')],
 ['zsf','Ich verwende <b>meine eigene Zusammenfassung</b> – keine kopierten Buchseiten oder ganzen Artikel.',()=>ki.src.includes('buch')]];
function kiValid(){return ki.src.length>0&&!ki.src.includes('praxis')&&KCK.every(([k,,need])=>!need()||ki.ck[k])}
const OPTAB=[['AFB I · Wissen','Gelerntes wiedergeben: Fakten, Begriffe, Methoden','nennen, angeben, aufzählen, wiedergeben, bezeichnen, vervollständigen, aufschreiben','Stichpunkte'],
 ['AFB II · Verständnis','Sachverhalte erfassen und mit eigenen Worten erklären','erklären, begründen, erläutern, beschreiben, umschreiben, schildern, präzisieren, verdeutlichen','ganze Sätze'],
 ['AFB III · Anwendung','Gelerntes in einer neuen Situation anwenden, z. B. an einem Fall aus der Praxis','anwenden, ermitteln, erarbeiten, herausfinden, entwickeln, ausführen','ganze Sätze']];
function split(n,mix){if(mix==='anwendung'){const a=Math.round(n*.25),c=Math.round(n*.4);return [a,n-a-c,c]}const a=Math.round(n/3),b=Math.round(n/3);return [a,b,n-a-b]}
function prompt1(){
  const [a,b,c]=split(ki.n,ki.mix),th=ki.thema.trim()||'[THEMA EINTRAGEN]';
  return `Du bist eine erfahrene Lehrkraft an einer Pflegeschule in Deutschland. Erstelle mir eine Probeklausur zum Thema „${th}“ für Auszubildende in der generalistischen Pflegeausbildung.

Verwende AUSSCHLIESSLICH die Inhalte aus meinem Lernmaterial weiter unten. Erfinde keine Fakten. Wenn mein Material für eine Aufgabe nicht ausreicht, schreib das offen dazu, statt etwas zu ergänzen.

Unsere Schule formuliert Aufgaben nach drei Anforderungsbereichen (AFB I–III). Nutze genau diese Operatoren:
- AFB I – Wissen (Antwort in Stichpunkten): nennen, angeben, aufzählen, wiedergeben, bezeichnen, vervollständigen, aufschreiben
- AFB II – Verständnis (Antwort in ganzen Sätzen): erklären, begründen, erläutern, beschreiben, umschreiben, schildern, präzisieren, verdeutlichen
- AFB III – Anwendung (Antwort in ganzen Sätzen): anwenden, ermitteln, erarbeiten, herausfinden, entwickeln, ausführen

Anforderungen:
- ${ki.n} Aufgaben: ${a} × AFB I, ${b} × AFB II, ${c} × AFB III.
- Bearbeitungszeit insgesamt: ${ki.zeit} Minuten.
- Jede Aufgabe beginnt mit einem Operator. Kennzeichne hinter jeder Aufgabe den Anforderungsbereich und eine Punktzahl zur Orientierung, z. B. „(AFB II · 4 Punkte)“.
- Gib bei Aufzählungen an, wie viele Aspekte erwartet werden, z. B. „Nennen Sie drei …“.${ki.fall?`
- Baue die Aufgaben des AFB III auf einer kurzen, realistischen Fallsituation aus der Pflege auf. Verwende einen erfundenen Namen und keine echten Patientendaten.`:''}
- Formuliere klar und eindeutig, ohne Fangfragen.
- Gib noch KEINE Lösungen aus. Warte, bis ich „Lösung“ schreibe.

Mein Lernmaterial:
[HIER DEINE MITSCHRIFT EINFÜGEN – ODER EIN SKRIPT, FÜR DAS DU DIE ERLAUBNIS DER LEHRKRAFT HAST. KEINE PATIENTENDATEN.]`;
}
function prompt2(){
  return `Lösung

Erstelle jetzt einen Erwartungshorizont zu jeder Aufgabe:
- Was muss eine vollständige Antwort enthalten? Nenne die erwarteten Aspekte.
- Wie verteilen sich die Punkte?
- Woran erkennt man, ob die Antwortform zum Anforderungsbereich passt (Stichpunkte bei AFB I, ganze Sätze bei AFB II und 3)?

Hier sind meine Antworten. Gib mir zu jeder Aufgabe eine freundliche, konkrete Rückmeldung: Was ist schon richtig? Was fehlt? Was ist fachlich falsch? Beziehe dich nur auf mein Lernmaterial. Wenn du dir bei einer Aussage nicht sicher bist, kennzeichne das.

Meine Antworten:
[HIER DEINE ANTWORTEN EINFÜGEN]`;
}

  const has=k=>ki.src.includes(k);
  return `<div class="card kigate" id="ki-gate"><div class="row" style="gap:10px;align-items:center"><span class="ic gate-ic">${ic('lock')}</span><div><span class="tag" style="background:var(--rose-l);color:var(--rose)">Pflicht vor dem Start</span><h2 style="margin-top:4px">Material-Check</h2></div></div>
   <p>Bevor du den Prompt-Generator nutzt: Prüf kurz, ob du dein Material überhaupt in eine KI geben darfst. Was du dort einfügst, verlässt dein Gerät und landet bei einem fremden Anbieter.</p>
   <div><b style="font-size:.92rem;color:var(--ink)">Woher stammt dein Lernmaterial?</b> <span class="note">(mehrere möglich)</span>
    <div class="chips" style="margin-top:8px">${KSRC.map(([k,l])=>`<button class="chip" data-ksrc="${k}" aria-pressed="${has(k)}">${l}</button>`).join('')}</div></div>
   ${has('praxis')?`<div class="box stop"><b>Stopp – das darf nie in eine KI.</b> Inhalte aus der Praxis unterliegen der Schweigepflicht und dem Datenschutz – auch beim Lernen, auch gekürzt oder ohne Namen. Wähle diese Quelle ab und arbeite mit erfundenen Fällen.</div>`:''}
   ${has('lehrkraft')?`<div class="box warm"><b>Materialien von Lehrkräften gehören ihnen.</b> Skripte, Folien und Arbeitsblätter sind geistiges Eigentum der Lehrkraft, die sie erstellt hat. Du darfst sie nur in eine KI geben, wenn sie <b>vorher zugestimmt</b> hat – frag kurz nach dem Unterricht oder per E-Mail. Ohne Zustimmung: Nimm deine eigene Mitschrift.</div>`:''}
   ${has('buch')?`<div class="box info"><b>Lehrbücher und Artikel</b> sind urheberrechtlich geschützt. Kopiere keine ganzen Seiten in eine KI – fasse das Wichtigste in eigenen Worten zusammen und nutze diese Zusammenfassung.</div>`:''}
   ${has('mitschrift')&&ki.src.length===1?`<div class="box ok">Sehr gut – deine eigene Mitschrift ist die sicherste Wahl.</div>`:''}
   ${ki.src.length&&!has('praxis')?`<div class="kichecks">${KCK.filter(([,,need])=>need()).map(([k,l])=>`<label class="ck ${ki.ck[k]?'on':''}"><input type="checkbox" data-kck="${k}" ${ki.ck[k]?'checked':''}><span class="bx">${ic('check')}</span><span>${l}</span></label>`).join('')}</div>`:''}
   <div class="row"><button class="btn" id="ki-confirm" ${kiValid()?'':'disabled'}>Bestätigen und Prompt-Generator öffnen</button></div>
   <p class="src">Deine Bestätigung wird nicht gespeichert und nicht gesendet. Sie ist deine Selbstverpflichtung und gilt nur für diesen Besuch.</p></div>`;
}

  <p class="src">Nach dem Blatt mit den Anforderungsbereichen eurer Pflegeschule (nach Bloom, 1956; Schewior-Popp, 2005). Zur überarbeiteten Taxonomie siehe Anderson & Krathwohl (2001).</p></div>
  <div class="card"><h2>So gehst du vor</h2><ol class="steps">

    <label class="f">Verteilung auf die Anforderungsbereiche<select id="ki-mix"><option value="ausgewogen" ${ki.mix==='ausgewogen'?'selected':''}>gleichmäßig auf alle drei Anforderungsbereiche</option><option value="anwendung" ${ki.mix==='anwendung'?'selected':''}>Schwerpunkt Anwendung</option></select></label>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px;padding-top:24px"><input type="checkbox" id="ki-fall" ${ki.fall?'checked':''}> AFB III mit Fallsituation</label>

   <p class="src">KI-Sprachmodelle bieten Chancen fürs Lernen, können aber falsche Inhalte erzeugen. Kritisches Prüfen bleibt nötig (Kasneci et al., 2023).</p></div>`;

function lockScroll(on){document.documentElement.classList.toggle('noscroll',on)}
function openGate(html,onReady){
  const g=document.createElement('div');g.className='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-labelledby','gate-h');
  g.innerHTML=`<div class="gate-card">${html}</div>`;document.body.appendChild(g);lockScroll(true);
  requestAnimationFrame(()=>g.classList.add('on'));
  const h=g.querySelector('#gate-h');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}
  g.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=[...g.querySelectorAll('button,input,a[href]')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});
  const close=()=>{g.classList.remove('on');lockScroll(false);setTimeout(()=>g.remove(),300)};
  onReady(g,close);
}
/* „gelesen“ = bis zum Ende gescrollt (oder alles passt auf den Bildschirm) */
function watchEnd(g,cb){const end=g.querySelector('.gate-end'),sc=g.querySelector('.gate-card');
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){io.disconnect();cb()}},{root:sc,threshold:1});io.observe(end)}else cb()}
function showRules(){
  if(document.querySelector('.gate'))return;
  openGate(`<span class="badge">Bevor du startest</span><h1 id="gate-h">Was erlaubt ist – und was nicht</h1><span style="color:var(--rose);display:block">${FL}</span>
   <p class="lead">Der Lernkompass hilft dir, mit deinen Unterlagen zu lernen – auch mit KI. Damit dabei niemand zu Schaden kommt, lies diese Regeln bitte einmal ganz durch.</p>
   ${rulesHTML()}
   <label class="ck gate-ck"><input type="checkbox" id="g-ok"><span class="bx">${ic('check')}</span><span>Ich habe die Regeln gelesen und halte mich daran.</span></label>
   <div class="gate-end"></div>
   <div class="gate-foot"><span class="gate-hint" id="g-hint">Bitte bis zum Ende lesen und bestätigen.</span><button class="btn" id="g-go" disabled>Verstanden – los geht’s</button></div>`,(g,close)=>{
    let read=false;const ck=g.querySelector('#g-ok'),go=g.querySelector('#g-go'),hint=g.querySelector('#g-hint');
    const upd=()=>{go.disabled=!(read&&ck.checked);hint.textContent=!read?'Bitte bis zum Ende lesen.':!ck.checked?'Bitte noch bestätigen.':'Danke!'};
    watchEnd(g,()=>{read=true;upd()});
    ck.onchange=()=>{ck.closest('.ck').classList.toggle('on',ck.checked);upd()};
    go.onclick=()=>{store.set(RKEY,{ok:true,ts:Date.now()});close();toast('Danke – viel Freude beim Lernen!');if(view==='ki')setTimeout(showKIBanner,350)};
  });
}
function showKIBanner(){
  if(kiBannerSeen||!rulesOk()||document.querySelector('.gate'))return;
  const SEC=15;
  openGate(`<span class="badge">Bevor du KI nutzt</span><h1 id="gate-h">Selbst denken – mit KI</h1><span style="color:var(--lav);display:block">${FL}</span>
   <p class="lead">KI kann dir beim Lernen helfen – oder dir das Lernen abnehmen. Der Unterschied: <b>Wer denkt?</b></p>
   <div class="dodont">
    <div class="dd do"><h3>${ic('check')} So denkst du selbst</h3><ul>
     <li><b>Erst ich, dann die KI:</b> Beantworte die Frage zuerst selbst.</li>
     <li>Lass dir von der KI <b>Fragen stellen</b> – und antworte aus dem Kopf.</li>
     <li>Bitte um <b>einen Hinweis</b>, nicht um die Lösung.</li>
     <li><b>Erklär der KI ein Thema</b> und lass dir Lücken zeigen.</li>
     <li><b>Prüf jede Antwort</b> mit Skript und Lehrbuch.</li>
     <li>Gib bei Abgaben an, <b>wofür du KI genutzt</b> hast.</li></ul></div>
    <div class="dd dont"><h3>${ic('x')} So nicht</h3><ul>
     <li>Hausaufgaben, Pflegeplanungen oder Reflexionen <b>schreiben lassen</b> und abgeben.</li>
     <li>KI-Zusammenfassungen <b>nur durchlesen</b>, statt selbst zu üben.</li>
     <li>Lösungen <b>abschreiben</b>, ohne sie zu verstehen.</li>
     <li>Zahlen, Quellen oder Pflegefachliches – etwa Dosierungen – <b>ungeprüft übernehmen</b>.</li></ul></div>
   </div>
   <div class="box tip"><b>Warum das wichtig ist:</b> In einer Studie mit fast 1.000 Schülerinnen und Schülern wurden die Ergebnisse beim Üben mit KI um 48 % besser – in der Prüfung ohne KI aber um 17 % schlechter als ohne KI. Eine KI, die nur Hinweise gab, glich den Nachteil weitgehend aus (Bastani et al., 2025).</div>
   <div class="gate-end"></div>
   <div class="gate-foot"><span class="gate-hint" id="g-hint">Bitte lies den Hinweis …</span><button class="btn" id="g-go" disabled>Noch ${SEC} Sek.</button></div>`,(g,close)=>{
    let left=SEC,read=false;const go=g.querySelector('#g-go'),hint=g.querySelector('#g-hint');
    const upd=()=>{const ok=left<=0&&read;go.disabled=!ok;go.textContent=left>0?`Noch ${left} Sek.`:'Verstanden – ich denke selbst';hint.textContent=!read?'Bitte bis zum Ende lesen.':left>0?'Gleich geht’s weiter …':'Danke!'};
    const t=setInterval(()=>{left--;upd();if(left<=0)clearInterval(t)},1000);
    watchEnd(g,()=>{read=true;upd()});upd();
    go.onclick=()=>{clearInterval(t);kiBannerSeen=true;try{sessionStorage.setItem('lk-ki-banner','1')}catch(e){}close()};
  });
}
function vRegeln(){return head('Regeln','Was erlaubt ist – und was nicht','Welches Material du nutzen darfst – mit und ohne KI – und warum.','')+`<div class="card">${rulesHTML()}</div>
  <div class="row"><button class="btn small ghost" id="rg-ki">Hinweis „Selbst denken mit KI“ noch einmal lesen</button></div>`}
AFTER.regeln=()=>{$('#rg-ki').onclick=()=>{kiBannerSeen=false;showKIBanner()}};

/* ---------- Startlogik ---------- */
function fromHash(){const h=location.hash.replace('#','');
 if(h.startsWith('t=')){tandemIn(h.slice(2));return ['pakete',null]}
 if(h.startsWith('methode-')&&MBY[h.slice(8)])return ['methode',h.slice(8)];
 if(['start','plan','finder','methoden','abruf','timer','mehr','auswerten','durchatmen','schlaf','klausurtag','pakete','woche','regeln','anfangen','ki','quellen'].includes(h))return [h,null];
 return null}
const fh=fromHash();if(fh){view=fh[0];param=fh[1]}
render();
if(!rulesOk())setTimeout(showRules,400);
window.addEventListener('hashchange',()=>{const f=fromHash();if(f&&(f[0]!==view||f[1]!==param))go(f[0],f[1])});
document.addEventListener('pointerdown',unlock,{once:true});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
