<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernkompass</title>
<meta name="description" content="Lernkompass: die passende Lernmethode finden, Methoden mit Belegen nachlesen, nach dem Unterricht abrufen, Aufschieben überwinden und mit KI eine Probeklausur erstellen.">
<meta name="theme-color" content="#f8f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1b23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernkompass">
<style>
@font-face{font-family:"Kompass Serif";src:url(fonts/kompass-serif.woff) format("woff");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Kompass Serif";src:url(fonts/kompass-serif-italic.woff) format("woff");font-weight:400 700;font-style:italic;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/poppins-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/poppins-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Poppins";src:url(fonts/poppins-700.woff) format("woff");font-weight:600 700;font-display:swap}
/* Layout: helle, luftige Lesespalte; feine Linienornamente schweben im Hintergrund; Karten mit weichen, mehrschichtigen Schatten; unten eine schwebende Navigationsleiste. */
:root{
  --bg:#fcfbfe; --bg2:#f6f3fb; --paper:#ffffff; --ink:#2b2834; --body:#514c5c; --muted:#8a8494; --line:#ece8f2; --line2:#ddd6e8;
  --lav:#7a68b8; --lav-l:#f0ecfa; --peach:#c47f52; --peach-l:#fdf0e6; --sage:#4f8a68; --sage-l:#e7f3ec;
  --sky:#4f86b8; --sky-l:#e8f1fa; --rose:#c06a7e; --rose-l:#fbebef; --gold:#a07714; --gold-l:#fcf4dc;
  --ok:#3a7c55; --ok-l:#e3f3e9; --no:#b0475e; --no-l:#fbe7eb;
  --sh-1:0 1px 2px rgba(60,48,96,.05),0 2px 6px rgba(60,48,96,.04);
  --sh-2:0 1px 2px rgba(60,48,96,.04),0 6px 18px -6px rgba(90,72,150,.14),0 18px 40px -24px rgba(90,72,150,.22);
  --sh-3:0 2px 4px rgba(60,48,96,.05),0 12px 28px -10px rgba(90,72,150,.22),0 30px 60px -30px rgba(90,72,150,.30);
  --orn:#b9acd9; --orn2:#e2b79a; --orn3:#9cc7ad;
  --serif:"Kompass Serif",Georgia,"Times New Roman",serif; --sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:66px; --ease:cubic-bezier(.22,.8,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a22; --bg2:#221f29; --paper:#27242e; --ink:#f1edf4; --body:#d5cfdb; --muted:#a39cab; --line:#363140; --line2:#433d4f;
  --lav:#b5a8e0; --lav-l:#322d45; --peach:#eeb995; --peach-l:#3f3128; --sage:#9cc4ab; --sage-l:#28372e;
  --sky:#9fc0de; --sky-l:#283542; --rose:#e4a1b0; --rose-l:#402e37; --gold:#e2bc5d; --gold-l:#3d3420;
  --ok:#8fd0a6; --ok-l:#24372b; --no:#ec98a8; --no-l:#43272e;
  --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.55); --sh-3:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.6);
  --orn:#5d5480; --orn2:#7a5a45; --orn3:#4b6b58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a22; --bg2:#221f29; --paper:#27242e; --ink:#f1edf4; --body:#d5cfdb; --muted:#a39cab; --line:#363140; --line2:#433d4f;
  --lav:#b5a8e0; --lav-l:#322d45; --peach:#eeb995; --peach-l:#3f3128; --sage:#9cc4ab; --sage-l:#28372e;
  --sky:#9fc0de; --sky-l:#283542; --rose:#e4a1b0; --rose-l:#402e37; --gold:#e2bc5d; --gold-l:#3d3420;
  --ok:#8fd0a6; --ok-l:#24372b; --no:#ec98a8; --no-l:#43272e;
  --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.55); --sh-3:0 2px 4px rgba(0,0,0,.35),0 18px 40px -16px rgba(0,0,0,.6);
  --orn:#5d5480; --orn2:#7a5a45; --orn3:#4b6b58; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(120% 60% at 100% 0%,var(--lav-l) 0%,transparent 55%),radial-gradient(90% 50% at 0% 100%,var(--peach-l) 0%,transparent 60%);background-attachment:fixed;
  color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.orn{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orn svg{position:absolute;fill:none;stroke-width:1;vector-effect:non-scaling-stroke}
.orn .o1{width:300px;height:300px;top:-90px;right:-110px;stroke:var(--orn)}
.orn .o2{width:180px;height:180px;bottom:9%;left:-70px;stroke:var(--orn2)}
.orn .o3{width:120px;height:120px;top:42%;right:-30px;stroke:var(--orn3)}
.orn .o4{width:90px;height:90px;top:16%;left:-18px;stroke:var(--orn)}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);text-wrap:balance;margin:0;line-height:1.22;letter-spacing:-.005em}
h1{font-size:clamp(1.75rem,5.4vw,2.35rem);font-weight:600}
h2{font-size:1.32rem;font-weight:600}
h3{font-size:1.04rem;font-weight:600}
p{margin:0}
a{color:var(--lav)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--lav);background:var(--paper);border:1px solid var(--line2);padding:5px 12px 5px 10px;border-radius:99px;width:fit-content;box-shadow:var(--sh-1)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.flourish{display:block;width:100%;max-width:260px;height:14px;color:var(--orn)}
.flourish path{stroke-dasharray:420;stroke-dashoffset:0}
header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
header.top .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
header.top .ill{width:clamp(104px,28vw,160px);aspect-ratio:1;max-width:100%}
header.top .ill img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(90,72,150,.14))}
.lead{max-width:62ch;grid-column:1/-1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px clamp(16px,3.5vw,26px);display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-2)}
.box{border-radius:16px;padding:13px 15px;font-size:.92rem;color:var(--ink);border:1px solid transparent}
.box.tip{background:var(--gold-l);border-color:color-mix(in srgb,var(--gold) 14%,transparent)} .box.info{background:var(--sky-l);border-color:color-mix(in srgb,var(--sky) 14%,transparent)} .box.warm{background:var(--rose-l);border-color:color-mix(in srgb,var(--rose) 14%,transparent)} .box.ok{background:var(--ok-l)} .box.lav{background:var(--lav-l);border-color:color-mix(in srgb,var(--lav) 14%,transparent)}
.box b.k{color:var(--gold)}
.note{font-size:.82rem;color:var(--muted)}
.src{font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:99px;padding:10px 20px;border:1px solid transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--lav) 88%,#fff),var(--lav));color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 1px rgba(60,48,96,.12),0 6px 16px -6px color-mix(in srgb,var(--lav) 70%,transparent);transition:transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 2px 2px rgba(60,48,96,.12),0 10px 22px -8px color-mix(in srgb,var(--lav) 75%,transparent)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line2);box-shadow:var(--sh-1)}
.btn.small{padding:6px 14px;font-size:.82rem}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.link{font:inherit;background:none;border:0;padding:0;color:var(--lav);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.opt:focus-within{outline:2px solid var(--lav);outline-offset:3px}
.back{font:inherit;font-size:.86rem;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0;width:fit-content}
input[type=text],input[type=date],textarea,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
input[type=text]:focus,input[type=date]:focus,textarea:focus,select:focus{outline:none;border-color:var(--lav);background:var(--paper);box-shadow:0 0 0 4px var(--lav-l)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.86rem;font-weight:500;color:var(--ink)}

/* Start */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}
.tile{font:inherit;text-align:left;cursor:pointer;border-radius:22px;padding:16px;border:1px solid var(--line);background:var(--paper);color:var(--body);display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative;overflow:hidden;box-shadow:var(--sh-2);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile::after{content:"";position:absolute;right:-26px;bottom:-26px;width:90px;height:90px;border-radius:50%;border:1px solid var(--tc,var(--orn));opacity:.5;transition:transform .5s var(--ease)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.tile:hover::after{transform:scale(1.25)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 4px 10px -4px currentColor}
.ic svg{width:22px;height:22px}
.tile b{font-family:var(--serif);font-size:1.08rem;color:var(--ink);line-height:1.25}
.tile span.d{font-size:.84rem}
.due{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--sage-l),var(--paper));border:1px solid var(--line);border-radius:20px;padding:14px 16px;color:var(--ink);box-shadow:var(--sh-2)}
.due .n{font-family:var(--serif);font-weight:700;font-size:2rem;color:var(--sage);line-height:1;min-width:1.2ch;text-align:center}

/* Finder */
.prog{display:flex;gap:5px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.prog i.done::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--lav),color-mix(in srgb,var(--lav) 60%,var(--rose)));border-radius:3px;animation:fill .5s var(--ease) both}
@keyframes fill{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:13px 15px;background:var(--paper);cursor:pointer;color:var(--ink);font-size:.94rem;line-height:1.4;box-shadow:var(--sh-1);transition:border-color .2s,background .2s,transform .2s var(--ease),box-shadow .2s}
.opt:hover{transform:translateX(2px);box-shadow:var(--sh-2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dot{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);margin-top:1px;display:grid;place-items:center;transition:border-color .2s}
.opt .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--lav);transform:scale(0);transition:transform .25s var(--ease)}
.opt small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.opt.sel{border-color:color-mix(in srgb,var(--lav) 55%,transparent);background:var(--lav-l)}
.opt.sel .dot{border-color:var(--lav)}
.opt.sel .dot::after{transform:scale(1)}
.rec{border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--paper);box-shadow:var(--sh-2);position:relative;overflow:hidden}
.rec.first{box-shadow:var(--sh-3);border-color:color-mix(in srgb,var(--lav) 30%,var(--line))}
.rec.first::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--lav),var(--rose),var(--peach))}
.rec .rank{font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--lav)}
.rec ul{margin:0;padding-left:18px;font-size:.9rem}

/* Methoden */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.82rem;border-radius:99px;padding:6px 14px;border:1px solid var(--line2);background:var(--paper);color:var(--body);cursor:pointer;box-shadow:var(--sh-1);transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--lav);color:#fff;border-color:var(--lav);box-shadow:0 6px 14px -6px var(--lav)}
.mlist{display:grid;gap:10px}
.mitem{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:15px 16px;background:var(--paper);color:var(--body);box-shadow:var(--sh-1);transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.mitem:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.mitem b{font-family:var(--serif);font-size:1.04rem;color:var(--ink)}
.mitem span.d{grid-column:1/-1;font-size:.84rem}
.ev{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.ev i{display:inline-flex;gap:2px}
.ev i em{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.22}
.ev i em.on{opacity:1}
.ev.e3{background:var(--ok-l);color:var(--ok)} .ev.e2{background:var(--gold-l);color:var(--gold)} .ev.e1{background:var(--no-l);color:var(--no)} .ev.e0{background:var(--bg2);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;font-weight:500;border-radius:99px;padding:2px 10px;background:var(--lav-l);color:var(--lav)}
.tag.art{background:var(--paper);border:1px solid var(--line2);color:var(--body)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{display:flex;gap:10px;align-items:center}
.sec h3 .bar{width:18px;height:1px;background:currentColor;opacity:.6}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px;font-size:.93rem}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid color-mix(in srgb,var(--lav) 40%,transparent);color:var(--lav);font-weight:600;display:grid;place-items:center;font-size:.8rem;box-shadow:var(--sh-1)}
.lv{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.02em;border-radius:99px;padding:1px 8px;margin-right:4px;vertical-align:1px;white-space:nowrap}
.lv-ok{background:var(--ok-l);color:var(--ok)} .lv-gold{background:var(--gold-l);color:var(--gold)} .lv-muted{background:var(--bg2);color:var(--muted)}
ul.stips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
ul.stips li{font-size:.92rem;line-height:1.55;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
ul.stips li b{color:var(--ink)}
.band{position:relative;height:34px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--bg2) 0 calc(25% - 1px),var(--line2) calc(25% - 1px) 25%);overflow:hidden;box-shadow:inset 0 1px 3px rgba(60,48,96,.08)}
.band span{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;transition:left .5s var(--ease),width .5s var(--ease)}
.band em{font-style:normal;font-size:.7rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden}
.seg-d{background:color-mix(in srgb,var(--rose) 38%,transparent);z-index:2}
.seg-s{background:color-mix(in srgb,var(--lav) 45%,transparent);z-index:3}
.seg-k{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--gold) 30%,transparent) 0 6px,transparent 6px 10px);z-index:1}
.band .seg-k{top:auto;height:8px}
.band-ax{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:-8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
input[type=time]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:10px 13px;width:100%;min-height:44px}
input[type=time]:focus{outline:none;border-color:var(--lav);background:var(--paper);box-shadow:0 0 0 4px var(--lav-l)}
.napout{font-size:1.05rem;color:var(--ink);padding:14px 16px;border-radius:16px;background:var(--lav-l);text-align:center}
.napout b{font-family:var(--serif);font-size:1.5rem;color:var(--lav)}
.calm.kt{background:linear-gradient(120deg,var(--rose-l),var(--paper))}
.calm .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.calm .ic svg{width:24px;height:24px}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;font-size:.92rem;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;transition:background .25s,border-color .25s}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck .bx{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;background:var(--paper);transition:all .25s var(--ease)}
.ck .bx svg{width:16px;height:16px}
.ck.on{background:var(--ok-l);border-color:color-mix(in srgb,var(--ok) 20%,transparent)}
.ck.on .bx{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.05)}
.ck.on span:last-child{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.ck:has(input:focus-visible){outline:2px solid var(--lav);outline-offset:2px}
.card.sos{background:linear-gradient(160deg,var(--paper),var(--sky-l));border-color:color-mix(in srgb,var(--sky) 25%,transparent)}
details.card summary{cursor:pointer;list-style:none;font-size:.95rem;color:var(--ink)}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";float:right;color:var(--lav);font-weight:600}
details.card[open] summary::after{content:"–"}
.attrfb{display:flex;flex-direction:column;gap:8px}
.attrfb:empty{display:none}
.attrfb .box{animation:rise .35s var(--ease) both}
.pakbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.pakbar{grid-template-columns:1fr}}
.pakb{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--paper);color:var(--body);box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s}
.pakb:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.pakb .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}.pakb .ic svg{width:22px;height:22px}
.pakb b{display:block;color:var(--ink);font-size:.92rem}

 {id:'abruf',name:'Aktives Abrufen',alias:'Selbsttest · „Gehirn-Entleerung“',ev:3,goals:['behalten','wiederholen','verstehen'],min:5,col:'lav',
  kurz:'Unterlagen zu – und alles aus dem Kopf holen, was du weißt. Danach vergleichen.',
  wie:['Unterlagen zuklappen.','Alles aufschreiben, was du zum Thema weißt – Stichworte, Skizzen, Pfeile. Oder: Fragen beantworten, Karteikarten abfragen.','Unterlagen öffnen und vergleichen. Fehlendes in einer zweiten Farbe ergänzen.','Aus den Lücken neue Fragen machen – sie sind dein Material fürs nächste Mal.'],
  wirk:'Beim Abrufen wird die Erinnerung nicht nur „abgelesen“, sondern neu aufgebaut. Das festigt die Gedächtnisspur und die Wege, auf denen du sie wiederfindest. Gleichzeitig zeigt dir der Vergleich ehrlich, was du schon kannst und was nicht. Wiederlesen erzeugt dagegen leicht das trügerische Gefühl „Kenn ich schon“. Abrufen fühlt sich anstrengender an – diese Mühe ist gewollt („erwünschte Schwierigkeit“).',
  pflege:'Direkt nach dem Unterricht zu den Vitalzeichen: 3 Minuten alles aufschreiben, was du über Puls, Blutdruck und Normwerte weißt. Dann mit der Mitschrift vergleichen.',
  stolper:['Ohne Vergleich prägst du dir auch Fehler ein – immer kontrollieren.','Am Anfang fällt wenig ein. Das ist normal und kein Zeichen, dass die Methode bei dir nicht wirkt.','Nur „im Kopf kurz drüber nachdenken“ reicht selten. Schreib oder sprich die Antwort wirklich aus.'],
  belege:[['roediger2006','Wer einen Text las und sich danach selbst testete, erinnerte sich eine Woche später an mehr als Lernende, die den Text erneut lasen – obwohl Letztere sich kurz nach dem Lernen sicherer fühlten.'],
   ['rowland2014','Meta-Analyse: Üben durch Abrufen bringt im Mittel mehr als erneutes Lernen mit dem Material.'],
   ['adesope2017','Meta-Analyse: Übungstests waren dem Wiederlesen und allen anderen Vergleichsbedingungen überlegen – in Schule, Hochschule und Labor.'],
   ['dunlosky2013','Überblicksarbeit zu zehn Lerntechniken: Selbsttesten erhält die Bewertung „hoher Nutzen“.'],
   ['karpicke2011','Abrufen führte in einem späteren Test zu mehr Lernerfolg als das Erstellen einer Concept-Map mit offenem Text.']]},
 {id:'verteilt',name:'Verteiltes Wiederholen',alias:'Spacing · 1 – 3 – 7 Tage',ev:3,goals:['behalten','wiederholen'],min:10,col:'sage',
  kurz:'Lieber oft kurz als einmal lang: denselben Stoff über mehrere Tage verteilt wiederholen.',
  wie:['Plane gleich nach dem Lernen feste Wiederholtermine, z. B. nach 1, 3 und 7 Tagen.','Jede Wiederholung ist kurz (10–15 Minuten) und beginnt mit Abrufen aus dem Kopf.','Je länger du dir etwas merken willst, desto größer dürfen die Abstände werden.','Trag die Termine in Kalender oder Abrufblatt ein – das Tool „Abrufen“ in dieser App macht das automatisch.'],
  wirk:'Zwischen zwei Lerneinheiten vergisst du ein wenig. Dadurch wird das nächste Abrufen anstrengender – und genau das stärkt die Erinnerung mehr als pausenloses Wiederholen am Stück. Außerdem bekommt das Gehirn zwischen den Einheiten Zeit zum Festigen, unter anderem im Schlaf.',
  pflege:'Die Medikamentengruppen aus der Pharmakologie nicht am Abend vor der Klausur, sondern über drei Wochen in vier kurzen Runden wiederholen.',
  stolper:['Massiertes Lernen („Bulimie-Lernen“) fühlt sich kurzfristig erfolgreicher an – das täuscht.','Ohne festen Plan gehen Wiederholungen im Alltag unter. Termine sofort eintragen.'],
  belege:[['cepeda2006','Überblick über viele Experimente: Verteiltes Lernen schlägt massiertes Lernen zuverlässig. Der günstigste Abstand wächst mit der Zeit, über die man sich etwas merken will.'],
   ['dunlosky2013','Verteiltes Üben erhält die Bewertung „hoher Nutzen“.'],
   ['murre2015','Ebbinghaus’ Vergessenskurve wurde mit modernen Methoden nachgebildet und im Wesentlichen bestätigt.'],
   ['diekelmann2010','Überblicksarbeit: Schlaf unterstützt das Festigen neu gelernter Inhalte im Gedächtnis.']]},
 {id:'karten',name:'Karteikarten & Leitner-Box',alias:'auch digital mit Anki oder Quizlet',ev:3,goals:['behalten','wiederholen'],min:10,col:'peach',
  kurz:'Fragen vorne, Antwort hinten – und gewusste Karten wandern in Fächer, die seltener drankommen.',
  wie:['Vorne eine echte Frage („Welche drei Anzeichen …?“), hinten die Antwort in eigenen Worten, gern mit Mini-Skizze.','Antwort laut oder schriftlich geben, bevor du umdrehst.','Gewusst: Karte ein Fach weiter. Nicht gewusst: zurück in Fach 1.','Fach 1 täglich, Fach 2 alle 2 Tage, Fach 3 wöchentlich, Fach 4 alle 2 Wochen, Fach 5 vor der Klausur.'],
  wirk:'Karteikarten verbinden die zwei wirksamsten Prinzipien: Abrufen und Verteilen. Die Leitner-Box sorgt dafür, dass schwierige Karten öfter kommen und leichte seltener.',
  pflege:'Fachbegriffe aus der Anatomie oder Normwerte – aber als Frage formuliert: „Ab welchem Wert spricht man von Tachykardie?“',
  stolper:['Karten zu früh aussortieren: Lege eine Karte erst weg, wenn du sie mehrmals hintereinander gewusst hast.','Nur Begriff ↔ Definition auswendig lernen bleibt oberflächlich. Ergänze Warum- und Anwendungsfragen.','Viele kleine Stapel, die man am Stück durchgeht, bringen weniger als ein großer, gemischter Stapel.'],
  belege:[['kornell2009','Lernen mit einem großen Kartenstapel (Wiederholungen weit verteilt) war wirksamer als mit mehreren kleinen Stapeln (Wiederholungen eng beieinander) – obwohl die Lernenden das Gegenteil vermuteten.'],
   ['miyatsu2018','Empfehlungen für gutes Karteikartenlernen: Karten nicht zu früh aussortieren, Antworten wirklich abrufen, Inhalte verknüpfen statt isoliert pauken.'],
   ['dunlosky2013','Die zugrunde liegenden Techniken – Selbsttesten und verteiltes Üben – haben hohen Nutzen.']]},

function scoreMethods(a){
  const s={};M.forEach(m=>{let v=m.ev*1.2;if(m.goals.includes(a.ziel))v+=3;if(m.goals[0]===a.ziel)v+=1;s[m.id]=v});
  const add=(id,n)=>{s[id]=(s[id]||0)+n};
  ({fakten:()=>{add('karten',2.5);add('abruf',1.5);add('verteilt',1)},zusammenhang:()=>{add('map',2);add('selbsterklaeren',2);add('warum',1.5);add('erklaeren',1)},text:()=>{add('sq3r',2.5);add('zusammenfassen',1);add('markieren',.5);add('selbsterklaeren',1)},faelle:()=>{add('mischen',3);add('erklaeren',.5)}}[a.stoff]||(()=>{}))();
  if(a.pruefung==='morgen'){add('abruf',3);add('karten',1);['map','zeichnen','sq3r','zusammenfassen'].forEach(i=>add(i,-2))}
  if(a.pruefung==='kurz'){add('abruf',1.5);add('karten',1);add('verteilt',1)}
  if(a.pruefung==='lang'||a.pruefung==='offen'){add('verteilt',1.5);add('karten',1)}
  M.forEach(m=>{if(a.zeit==='10'&&m.min>15)add(m.id,-3);if(a.zeit==='25'&&m.min>25)add(m.id,-1.5)});
  if(a.wer==='zuzweit'){add('erklaeren',2);add('karten',.5);add('abruf',.5)}
  if(a.gefuehl==='muede'){add('abruf',.5);['sq3r','mischen','map'].forEach(i=>add(i,-1.5))}
  if(a.gefuehl==='unruhig'){add('abruf',.5);add('karten',.5)}
  M.forEach(m=>{const pr=personal(m.id);if(pr.n>=2)add(m.id,(pr.eff-3)*0.9)});
  return Object.entries(s).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
}
function whyFor(id,a){
  const w=[],m=MBY[id];
  if(m.goals.includes(a.ziel))w.push(`passt zu deinem Ziel „${GOALS[a.ziel]}“`);
  if(id==='karten'&&a.stoff==='fakten')w.push('ideal für Begriffe und Zahlen');
  if(id==='mischen'&&a.stoff==='faelle')w.push('hilft, Ähnliches auseinanderzuhalten');
  if((id==='map'||id==='selbsterklaeren'||id==='warum')&&a.stoff==='zusammenhang')w.push('macht Zusammenhänge sichtbar');
  if(id==='sq3r'&&a.stoff==='text')w.push('gemacht für lange Fachtexte');
  if(id==='abruf'&&a.pruefung==='morgen')w.push('kurz vor der Prüfung das Wirksamste: prüfen, was sitzt');
  if(id==='verteilt'&&(a.pruefung==='lang'||a.pruefung==='offen'))w.push('du hast Zeit – nutze sie für mehrere kurze Runden');
  if(id==='erklaeren'&&a.wer==='zuzweit')w.push('ihr seid zu zweit – perfekt zum gegenseitigen Erklären');
  if(m.min<=10&&a.zeit==='10')w.push('passt in 10 Minuten');
  const pr=personal(id);if(pr.n>=2&&pr.eff>=3.5)w.push(`hat bei dir gut funktioniert (Ø ${pr.eff.toFixed(1).replace('.',',')} von 5 aus ${pr.n} Einheiten)`);
  w.push(EVL[m.ev]);
  return w;
}

     <button class="mode" data-mode="frei" aria-pressed="${ab.mode==='frei'}"><b>Frei aus dem Kopf</b><span class="note">Leeres Blatt, keine Hilfen. Am anstrengendsten – und am wirksamsten.</span></button>
     <button class="mode" data-mode="hinweis" aria-pressed="${ab.mode==='hinweis'}"><b>Mit Hinweisen</b><span class="note">Erst Überschriften notieren, dann darunter ergänzen. Gut für den Einstieg.</span></button>
     <div class="mode" style="cursor:default;opacity:.75"><b>Wiedererkennen</b><span class="note">Antworten auswählen (z. B. Multiple Choice) – am leichtesten, bringt fürs Behalten am wenigsten.</span></div></div>
     <p class="src" style="margin-top:6px">Die Gedächtnisforschung unterscheidet freie Reproduktion, Reproduktion mit Hinweisreizen und Wiedererkennen (Horstmann & Dreisbach, 2012).</p></div>
    <div><div class="note" style="margin-bottom:6px">Wie lange willst du aus dem Kopf schreiben?</div><div class="seg" role="group" aria-label="Dauer">${[2,3,5].map(n=>`<button data-min="${n}" aria-pressed="${ab.mins===n}">${n} Minuten</button>`).join('')}</div></div>
    <div class="box info">Klapp deine Unterlagen jetzt zu. Du kannst auf Papier schreiben oder hier tippen.</div>
    <button class="btn" id="ab-go" ${ab.thema.trim()?'':'disabled'}>Los geht’s</button></div>`;
  } else if(ab.step===1){
    body=`<div class="card"><h2>Alles, was du noch weißt</h2><p>Stichworte, Skizzen, Pfeile – alles zählt. Nicht nachschauen.</p>${ab.mode==='hinweis'?'<div class="box lav">Schreib zuerst 3–5 Überschriften aus dem Unterricht auf. Ergänze dann unter jeder Überschrift alles, was dir dazu einfällt.</div>':''}
    <div class="stage"><div class="clock" id="ab-clock">${fmt(ab.mins*60)}</div><div class="ring"><span id="ab-ring"></span></div><button class="btn small" id="ab-start">Timer starten</button></div>
    <label class="f">Deine Notizen (optional)<textarea id="ab-dump" placeholder="Was fällt dir ein?">${esc(ab.dump)}</textarea></label>
    <div class="row"><button class="btn" id="ab-next">Fertig – jetzt vergleichen</button></div></div>`;
  } else if(ab.step===2){
    body=`<div class="card"><h2>Jetzt vergleichen</h2><p>Öffne deine Unterlagen. Was fehlte oder war falsch? Ergänze es in einer zweiten Farbe – oder notiere es hier.</p>
    <label class="f">Meine Lücken<textarea id="ab-gaps" placeholder="z. B. Normwert Blutdruck vergessen, Unterschied Tachy- und Bradykardie unklar">${esc(ab.gaps)}</textarea></label>
    <div class="box lav">Lücken sind kein Versagen, sondern dein wertvollstes Material. Genau dort lohnt sich die nächste Wiederholung.</div>
    <div class="box info"><b>Warum vergleichen so wichtig ist:</b> Erinnern ist kein Abspielen, sondern ein Rekonstruieren. Schon Bartlett (1932) zeigte, dass Erinnerungen beim wiederholten Nacherzählen vereinfacht und an eigene Erwartungen angepasst werden. Der Abgleich mit den Unterlagen schützt davor, Fehler einzuprägen.</div>
    <div class="row"><button class="btn ghost" id="ab-prev">Zurück</button><button class="btn" id="ab-next">Weiter zu den Fragen</button></div></div>`;
  } else if(ab.step===3){
    body=`<div class="card"><h2>Drei Fragen für dein zukünftiges Ich</h2><p>Schreib je eine Frage pro Anforderungsbereich. Die beantwortest du bei der nächsten Wiederholung aus dem Kopf.</p>
    ${OPS.map(([c,l,v],i)=>`<div class="qrow"><span class="lvl ${c}">${i+1}</span><label class="f">${l}<input type="text" data-q="${i}" maxlength="200" placeholder="${v.split(',')[0][0].toUpperCase()+v.split(',')[0].slice(1)} …" value="${esc(ab.q[i])}"><span class="note">Operatoren: ${v}</span></label></div>`).join('')}
    <div><div class="note" style="margin-bottom:6px">Wie sicher fühlst du dich jetzt mit dem Thema?</div><div class="conf">${['unsicher','teils','ziemlich sicher'].map((c,i)=>`<button data-conf="${i}" aria-pressed="${ab.conf===i}">${c}</button>`).join('')}</div></div>
    <div class="row"><button class="btn ghost" id="ab-prev">Zurück</button><button class="btn" id="ab-save" ${ab.q.some(x=>x.trim())?'':'disabled'}>Speichern und Plan erstellen</button></div></div>`;
  } else {
    const c=Date.now();
    body=`<div class="card"><h2>Gespeichert: dein Wiederholplan</h2>${ab.ziel?`<div class="box tip"><b class="k">Dein Ziel:</b> ${esc(ab.ziel)}<br><span class="note">Kurz bewerten: Wie nah bist du heute dran? Bei der Wiederholung prüfst du es erneut.</span></div>`:''}<p>Die App erinnert dich auf der Startseite, wenn eine Wiederholung fällig ist.</p>
    <ul class="plain">${STEPS.map(d=>`<li><b>${dstr(addDays(today0(),d))}</b> – nach ${d} ${d===1?'Tag':'Tagen'}</li>`).join('')}</ul>
    <div class="box info">Die Wiederholungen sind auf diesem Gerät gespeichert, nicht online. Wer die Browserdaten löscht, löscht auch den Plan.</div>
    <div class="row"><button class="btn" id="ab-new">Neues Thema abrufen</button></div></div>`;
  }
  const list=entries().slice().sort((x,y)=>(nextDue(x)??9e15)-(nextDue(y)??9e15));
  const t=today0();
  const lst=list.length?`<div class="card"><h3>Meine Wiederholungen</h3>${list.map(e=>{const d=nextDue(e);const st=d===null?['fest','gefestigt']:d<=t?['today','heute fällig']:['later',dstr(d)];return `<div class="entry"><b>${esc(e.thema)}</b><span class="st ${st[0]}">${st[1]}</span><div class="acts">${d!==null?`<button class="btn small ${d<=t?'':'ghost'}" data-rev="${e.id}">Jetzt wiederholen</button>`:`<button class="btn small ghost" data-again="${e.id}">In 14 Tagen nochmal</button>`}<button class="btn small ghost" data-del="${e.id}">Löschen</button></div></div>`}).join('')}</div>`:'';
  return head('Abrufen nach dem Unterricht','5 Minuten aus dem Kopf','Direkt nach dem Unterricht: planen, aufschreiben, was hängen geblieben ist, vergleichen, Fragen formulieren – und die App plant die Wiederholungen nach 1, 3 und 7 Tagen.','lernen')+(ab.step===0?`<div class="pakbar"><button class="pakb" data-pktab="pakete"><span class="ic" style="background:var(--peach-l);color:var(--peach)">${ic('book')}</span><span><b>Fertige Fragen-Pakete</b><span class="note">zu allen 8 Blöcken des Moduls</span></span></button><button class="pakb" data-pktab="tandem"><span class="ic" style="background:var(--lav-l);color:var(--lav)">${ic('spark')}</span><span><b>Tandem</b><span class="note">Fragen tauschen per Link oder QR</span></span></button></div>`:'')+flow+body+lst+
  `<p class="src">Warum das wirkt: Abrufen festigt Gelerntes stärker als Wiederlesen (Roediger & Karpicke, 2006; Adesope et al., 2017), und verteilte Wiederholungen halten es länger (Cepeda et al., 2006).</p>`;
}
AFTER.abruf=()=>{
  bindList();
  if(ab.review){bindReview();return}
  const zi=$('#ab-ziel');if(zi)zi.oninput=()=>ab.ziel=zi.value;
  const asb=$('#ab-sub');if(asb)asb.onchange=()=>{ab.sub=asb.value;const f=findSub(ab.sub);if(f){ab.thema=f.s.name;const t=$('#ab-thema');t.value=ab.thema;$('#ab-go').disabled=false}};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ab.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const th=$('#ab-thema');if(th){th.oninput=()=>{ab.thema=th.value;$('#ab-go').disabled=!th.value.trim()};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{ab.mins=+b.dataset.min;document.querySelectorAll('[data-min]').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('#ab-go').onclick=()=>{unlock();ab.step=1;render();startDump()}}
  const st=$('#ab-start');if(st)st.onclick=()=>{unlock();startDump()};
  const dp=$('#ab-dump');if(dp)dp.oninput=()=>ab.dump=dp.value;
  const gp=$('#ab-gaps');if(gp)gp.oninput=()=>ab.gaps=gp.value;
  document.querySelectorAll('[data-q]').forEach(inp=>inp.oninput=()=>{ab.q[+inp.dataset.q]=inp.value;$('#ab-save').disabled=!ab.q.some(x=>x.trim())});
  document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{ab.conf=+b.dataset.conf;document.querySelectorAll('[data-conf]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const nx=$('#ab-next');if(nx)nx.onclick=()=>{stopTimers();ab.step++;render()};
  const pv=$('#ab-prev');if(pv)pv.onclick=()=>{ab.step--;render()};
  const sv=$('#ab-save');if(sv)sv.onclick=()=>{const a=entries();if(ab.sub)setSub(ab.sub,1);a.push({id:Date.now().toString(36),sub:ab.sub,thema:ab.thema.trim(),ziel:ab.ziel.trim(),created:today0(),q:ab.q.map(s=>s.trim()).filter(Boolean),gaps:ab.gaps.trim(),conf:ab.conf,done:0});saveEntries(a);ab.step=4;render()};
  const nw=$('#ab-new');if(nw)nw.onclick=()=>{ab={step:0,thema:'',sub:'',ziel:'',mode:'frei',dump:'',gaps:'',q:['','',''],conf:null,mins:3,review:null};render()};
};
function startDump(){const t=Timer(ab.mins*60,(r,s)=>{const c=$('#ab-clock'),g=$('#ab-ring');if(c){c.textContent=fmt(r);c.classList.toggle('warn',r<=15)}if(g)g.style.width=(100*(1-r/s))+'%'},()=>{gong(1);toast('Zeit! Jetzt vergleichen.')});t.start();const b=$('#ab-start');if(b)b.textContent='Neu starten'}
function bindList(){
  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ab.review={id:b.dataset.rev,show:false};render();window.scrollTo({top:0})});
  document.querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>{const a=entries();const e=a.find(x=>x.id===b.dataset.again);if(e){e.created=addDays(today0(),14-STEPS[STEPS.length-1]);e.done=STEPS.length-1;saveEntries(a);toast('Wiederholung in 14 Tagen geplant');render()}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.sure){saveEntries(entries().filter(x=>x.id!==b.dataset.del));render()}else{b.dataset.sure='1';b.textContent='Wirklich löschen?';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Löschen'}},3000)}});
}
function vReview(){
  const e=entries().find(x=>x.id===ab.review.id);
  if(!e){ab.review=null;return vAbruf()}
  const n=(e.done||0)+1;
  return `<button class="back" id="rv-back">← Zurück zu „Abrufen“</button>`+head(`Wiederholung ${n} von ${STEPS.length}`,esc(e.thema),'Beantworte jede Frage aus dem Kopf – laut oder auf Papier. Erst danach schaust du in deine Unterlagen.')+
  `<div class="card">${e.ziel?`<div class="box tip"><b class="k">Dein Ziel:</b> ${esc(e.ziel)}</div>`:''}<div class="box lav"><b>Erst frei:</b> Schreib eine Minute lang alles auf, was du noch zu „${esc(e.thema)}“ weißt. Danach nutzt du deine Fragen als Hinweise.</div>${e.q.map((q,i)=>`<div class="qrow"><span class="lvl l${Math.min(3,i+1)}">${i+1}</span><p style="color:var(--ink);padding-top:4px">${esc(q)}</p></div>`).join('')}
  ${e.gaps?`<div><button class="btn small ghost" id="rv-show">${ab.review.show?'Lücken vom letzten Mal ausblenden':'Lücken vom letzten Mal zeigen'}</button>${ab.review.show?`<div class="box warm" style="margin-top:8px">${esc(e.gaps)}</div>`:''}</div>`:''}
  <div class="box info">Vergleiche jetzt mit deinen Unterlagen. Was du nicht wusstest, ist der Schwerpunkt fürs nächste Mal.</div>
  <div class="row"><button class="btn" id="rv-done">Erledigt</button></div></div>`;
}
function bindReview(){
  $('#rv-back').onclick=()=>{ab.review=null;render()};
  const s=$('#rv-show');if(s)s.onclick=()=>{ab.review.show=!ab.review.show;render()};
  $('#rv-done').onclick=()=>{const a=entries();const e=a.find(x=>x.id===ab.review.id);if(e){e.done=(e.done||0)+1;e.hist=(e.hist||[]).concat(Date.now());saveEntries(a);if(e.sub)setSub(e.sub,e.done>=STEPS.length?2:1);const d=nextDue(e);toast(d===null?'Gefestigt – stark!':'Nächste Wiederholung: '+dstr(d))}ab.review=null;render()};
}

/* ---------- Anfangen ---------- */
let an={path:null,focus:25,brk:5,round:0,wenn:'',dann:'',wert:3,erw:3,konkret:2};
const PILL={gross:'lernen',unangenehm:'winken',angst:'ruhe',erschoepft:'erschoepft',ablenkung:'handy'};
const PATHS=[
 ['gross','Die Aufgabe ist riesig. Ich weiß nicht, wo ich anfangen soll.','1','sky'],
 ['unangenehm','Es ist langweilig oder unangenehm.','2','peach'],
 ['angst','Ich habe Angst, es nicht gut genug zu machen.','3','rose'],
 ['erschoepft','Ich bin erschöpft oder leer.','4','sage'],
 ['ablenkung','Das Handy und alles andere sind gerade spannender.','5','gold']];
const PATHTXT={
 gross:{h:'Mach den ersten Schritt lächerlich klein',p:['Schreib den <b>allerkleinsten nächsten Schritt</b> auf – so klein, dass er fast albern wirkt: „Skript aufschlagen, Kapitel 3 finden.“','Plane nur diesen einen Schritt. Danach entscheidest du neu.','Große Aufgaben in Scheiben schneiden: Welche drei Teile hat das Thema? Heute nur Teil 1.','Mach dein Ziel <b>konkret</b>: statt „Ich lerne Anatomie“ lieber „Bis 18 Uhr beantworte ich 10 Karteikarten zum Herz“.'],e:'Konkrete, herausfordernde Ziele führten in vielen Studien zu besseren Leistungen als vage Vorsätze wie „Ich gebe mein Bestes“ (Latham & Locke, 1991). Konkrete Wenn-dann-Pläne helfen, Vorhaben umzusetzen (Gollwitzer & Sheeran, 2006). Dass der allererste Schritt klein sein sollte, ist Erfahrungswissen.'},
 unangenehm:{h:'Der 10-Minuten-Deal',p:['Vereinbare mit dir: <b>nur 10 Minuten</b>. Danach darfst du aufhören – ohne schlechtes Gewissen.','Starte den Fokus-Timer mit 10 Minuten (Icon „Timer“ unten).','Oft ist das Anfangen das Schwerste. Wenn du nach 10 Minuten weitermachen willst: gern. Wenn nicht: Du hast trotzdem etwas geschafft.','Belohnung danach planen – etwas Kleines, auf das du dich freust.'],e:'Aufschieben ist oft ein Versuch, unangenehme Gefühle kurzfristig zu vermeiden – nicht Faulheit (Sirois & Pychyl, 2013). Ein kurzer, begrenzter Start macht das Gefühl aushaltbarer.'},
 angst:{h:'Freundlich mit dir sein – gerade jetzt',p:['Sag dir einen Satz, den du einer Freundin sagen würdest: <i>„Es ist verständlich, dass ich unsicher bin. Ich darf es Schritt für Schritt versuchen.“</i>','Gib dir die Erlaubnis für einen <b>schlechten ersten Entwurf</b>. Verbessern kannst du später.','Fang mit etwas an, das dir sicher gelingt. Kleine Erfolge stärken das Vertrauen, es zu schaffen.','Erklär dir Rückschläge mit Dingen, die du ändern kannst: „Ich habe zu spät angefangen“ statt „Ich bin halt nicht schlau genug“.','Wenn du in der Vergangenheit aufgeschoben hast: Verzeih es dir. Das macht den nächsten Start leichter.'],e:'Selbstmitgefühl erhöhte in Studien die Motivation, sich zu verbessern (Breines & Chen, 2012); wer sich das Aufschieben verzieh, schob vor der nächsten Prüfung weniger auf (Wohl et al., 2010). Eigene Erfolgserlebnisse gelten als stärkste Quelle von Selbstwirksamkeit (Bandura, 1977). Wer Misserfolg auf veränderbare, beeinflussbare Ursachen wie Anstrengung oder Vorgehen zurückführt, bleibt eher zuversichtlich als bei Ursachen wie „Begabung“ (Weiner, 1979). Menschen mit starker Angst vor Misserfolg neigen dazu, Leistungssituationen zu meiden (Atkinson, 1957) – Aufschieben kann ein solcher Schutzversuch sein.'},
 erschoepft:{h:'Vielleicht ist das gar kein Aufschieben',p:['Prüf ehrlich: Hast du genug geschlafen, gegessen, getrunken? Kommst du aus einem (Nacht-)Dienst?','Zum Runterkommen helfen kleine Werkzeuge unter <button class="link" data-go="durchatmen">Durchatmen</button>: bewegen, atmen oder erden.','Wenn ja: Eine <b>echte Pause</b> ist jetzt klüger als Lernen mit Druck. Plane einen konkreten Lerntermin für später.','Wenn du trotzdem etwas tun möchtest: höchstens 10 Minuten etwas Leichtes aus dem Kopf abrufen.','Hält die Erschöpfung über längere Zeit an, sprich mit einer Vertrauensperson, deiner Praxisanleitung oder deiner Hausärztin.'],e:'Erschöpfung und Aufschieben sehen von außen ähnlich aus, brauchen aber Unterschiedliches. Bei Erschöpfung hilft Erholung – nicht mehr Disziplin.'},
 ablenkung:{h:'Die Umgebung arbeiten lassen',p:['Handy <b>in einen anderen Raum</b> oder in eine Tasche außer Sicht – nicht nur umdrehen.','Eine Aufgabe, ein Tab, ein Heft: die Ein-Ding-Regel.','Den Fokus-Timer starten (Icon „Timer“ unten). In der Pause darfst du kurz aufs Handy – aber nur in der Pause.','Schreib einen Wenn-dann-Plan: „Wenn ich zum Handy greifen will, dann trinke ich einen Schluck und lese den nächsten Absatz.“'],e:'Konkrete Wenn-dann-Pläne haben in einer Meta-Analyse die Umsetzung von Zielen deutlich verbessert (Gollwitzer & Sheeran, 2006). Feste Pausen nach der Pomodoro-Methode gingen in einer Studie mit weniger Ermüdung einher (Biwer et al., 2023).'}
};
function vAnfangen(){
  const p=an.path?PATHTXT[an.path]:null;
  return head('Anfangen statt Aufschieben','Was hält dich gerade ab?','Aufschieben ist menschlich. Meist geht es dabei um Gefühle, nicht um mangelnde Disziplin. Wähle, was am ehesten passt.','handy')+
  `<div class="paths" role="group" aria-label="Was hält dich ab">${PATHS.map(([k,l,n,c])=>`<button class="pathbtn" data-path="${k}" aria-pressed="${an.path===k}"><span class="e" style="background:var(--${c}-l);color:var(--${c})">${n}</span><span>${l}</span></button>`).join('')}</div>`+
  (p?`<div class="card" id="an-res"><div class="res"><h2>${p.h}</h2><div class="ill"><img src="img/${PILL[an.path]}.png" alt=""></div></div><ol class="steps">${p.p.map(s=>`<li><span>${s}</span></li>`).join('')}</ol><p class="src">${p.e}</p></div>`:'')+
  `<div class="card"><h2>Motivations-Check</h2><p>Motivation hängt davon ab, wie wichtig dir etwas ist und wie sehr du dir zutraust, es zu schaffen. Schieb die Regler so, wie es gerade für dich stimmt.</p>
   ${[['wert','Wie wichtig ist mir diese Aufgabe?','unwichtig','sehr wichtig'],['erw','Wie sehr traue ich mir zu, sie zu schaffen?','gar nicht','voll und ganz'],['konkret','Wie konkret ist mein Ziel?','ganz vage','ganz konkret']].map(([k,l,a,b])=>`<div class="slider"><label for="mv-${k}">${l}<output id="mv-${k}-o">${an[k]} / 5</output></label><input type="range" id="mv-${k}" min="1" max="5" step="1" value="${an[k]}"><div class="scale"><span>${a}</span><span>${b}</span></div></div>`).join('')}
   <div class="box lav" id="mv-out"></div>
   <p class="src">Nach Erwartung-mal-Wert-Modellen ist Motivation am stärksten, wenn Wert und Erfolgserwartung beide hoch sind (Atkinson, 1957). Konkrete Ziele wirken stärker als vage (Latham & Locke, 1991). Selbstbestimmung, Kompetenzerleben und Verbundenheit fördern Motivation, die von innen kommt (Deci & Ryan, 1993).</p></div>`+
  `<button class="tile" data-go="timer" style="--tc:var(--lav);min-height:0;flex-direction:row;align-items:center;gap:14px"><span class="ic" style="background:var(--lav-l);color:var(--lav)">${ic('timer')}</span><span style="display:flex;flex-direction:column;gap:2px"><b>Zum Fokus-Timer</b><span class="d">Der nächste Schritt steht? Dann mit festen Pausen loslegen.</span></span></button>
  <div class="card"><h2>Mein Wenn-dann-Plan</h2>
  <div class="grid2"><label class="f">Wenn …<input type="text" id="wd-w" maxlength="120" placeholder="ich nach dem Dienst nach Hause komme" value="${esc(an.wenn)}"></label><label class="f">… dann …<input type="text" id="wd-d" maxlength="120" placeholder="lege ich mein Handy weg und rufe 5 Minuten ab" value="${esc(an.dann)}"></label></div>
  <div class="box lav" id="wd-out">${an.wenn&&an.dann?`<b>Wenn</b> ${esc(an.wenn)}, <b>dann</b> ${esc(an.dann)}.`:'Dein Plan erscheint hier.'}</div>
  <div class="row"><button class="btn small" id="wd-copy">Plan kopieren</button></div>
  <p class="src">Wenn-dann-Pläne („Implementation Intentions“) verbessern die Umsetzung von Vorhaben in vielen Studien (Gollwitzer & Sheeran, 2006).</p></div>
  <div class="box info"><b>Wenn Aufschieben dich stark belastet:</b> Hilfe zu holen ist ein Zeichen von Stärke. Interventionen können Aufschieben deutlich verringern, besonders kognitiv-verhaltenstherapeutische Ansätze (van Eerde & Klingsieck, 2018). Ansprechpartnerinnen: Lehrkräfte, Praxisanleitung, Beratungsstellen.</div>`;
}
AFTER.anfangen=()=>{
  document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{an.path=b.dataset.path;render();const r=$('#an-res');if(r)r.scrollIntoView({behavior:'smooth',block:'start'})});
  const mv=()=>{const W=an.wert,E=an.erw,K=an.konkret;let t;
   if(W<=2&&E<=2)t='<b>Wenig Wert, wenig Zutrauen:</b> Kein Wunder, dass der Start schwerfällt. Frag dich: Wofür brauche ich das später in der Pflege? Und such dir einen Einstieg, der sicher klappt.';
   else if(W<=2)t='<b>Der Sinn fehlt gerade:</b> Verbinde die Aufgabe mit etwas, das dir wichtig ist – einer Patientensituation, deinem Examen, deinem Wunsch, sicher zu handeln. Auch eine kleine Belohnung danach darf sein.';
   else if(E<=2)t='<b>Wichtig, aber du traust es dir wenig zu:</b> Mach den ersten Schritt kleiner, bis du denkst „Das schaffe ich“. Jeder kleine Erfolg stärkt das Zutrauen. Lernen mit einer Mitschülerin hilft zusätzlich.';
   else t='<b>Gute Ausgangslage:</b> Dir ist es wichtig und du traust es dir zu. Starte jetzt den Fokus-Timer.';
   if(K<=2)t+='<br><b>Tipp:</b> Formuliere dein Ziel konkreter – was genau, wie viel, bis wann?';

const PKEY='lernkompass-plan-v1';

function plan(){const p=store.get(PKEY,null);return p&&Array.isArray(p.exams)?p:{exams:[]}}
function savePlan(p){store.set(PKEY,p)}
const dateMs=d=>{const [y,m,t]=String(d).split('-').map(Number);return new Date(y,(m||1)-1,t||1).getTime()};
const daysTo=d=>Math.round((dateMs(d)-today0())/864e5);
const STAT=['offen','bearbeitet','sicher'];
function allSubs(p){const out=[];(p||plan()).exams.forEach(e=>e.topics.forEach(t=>t.subs.forEach(s=>out.push({e,t,s}))));return out}
function findSub(id){return allSubs().find(x=>x.s.id===id)||null}
function setSub(id,st){const p=plan();allSubs(p).forEach(x=>{if(x.s.id===id){x.s.status=Math.max(x.s.status||0,st);x.s.last=Date.now()}});savePlan(p)}
function counts(e){let c=[0,0,0];e.topics.forEach(t=>t.subs.forEach(s=>c[s.status||0]++));return c}
function subSelect(id,val){const subs=allSubs().filter(x=>daysTo(x.e.date)>=0);if(!subs.length)return '';
  return `<label class="f">Aus deinem Lernplan <span class="note" style="font-weight:400">(optional)</span><select id="${id}"><option value="">– eigenes Thema eintragen –</option>${subs.map(x=>`<option value="${x.s.id}" ${val===x.s.id?'selected':''}>${esc(x.e.name)} › ${esc(x.t.name)} › ${esc(x.s.name)} (${STAT[x.s.status||0]})</option>`).join('')}</select></label>`}
function suggestions(n){
  const t0=Date.now(),list=[];
  plan().exams.filter(e=>daysTo(e.date)>=0).forEach(e=>{const d=daysTo(e.date);e.topics.forEach(t=>t.subs.forEach(s=>{const st=s.status||0;if(st===2)return;
    const age=s.last?(t0-s.last)/864e5:99;if(st===1&&age<2)return;
    list.push({e,t,s,score:(st===0?0:1)*10+d+(st===1?-Math.min(age,6):0)})}))});
  return list.sort((a,b)=>a.score-b.score).slice(0,n);
}
function todayCard(n,compact){

  return head('Lernplan','Deine Klausuren im Blick','Trag ein, wann welche Klausur ist und welche Themen dazugehören. Teile große Themen in kleine Unterthemen – so wird der Berg kleiner, und du siehst, was du schon geschafft hast.','lernen')+

   (past.length?`<div class="card"><h3>Vergangene Klausuren</h3>${past.map(e=>{const c=counts(e);return `<div class="row" style="justify-content:space-between"><span>${esc(e.name)} <span class="note">· ${c[2]}/${c[0]+c[1]+c[2]} sicher</span></span><span class="row" style="gap:6px"><button class="mini" data-kt="${e.id}">Rückblick</button><button class="mini" data-delex="${e.id}">Löschen</button></span></div>`}).join('')}</div>`:'')+
   `<p class="src">Warum kleine Unterthemen und ein verteilter Plan? Konkrete Teilziele wirken stärker als vage Vorsätze (Latham & Locke, 1991), und über mehrere Tage verteiltes Lernen hält länger als Lernen am Stück (Cepeda et al., 2006). Gespeichert wird nur auf diesem Gerät.</p>`;

function parseDate(v){v=v.trim();let m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?v:null}

const f1=x=>x.toFixed(1).replace('.',',');

    if(r.feel>=3.5&&r.eff<=2.5)msgs.push(`<b>${nm}</b> ist für dich angenehm, aber es bleibt wenig hängen. Kombiniere die Methode mit einem Abruf-Schritt aus dem Kopf.`)});

const t2m=t=>{if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const m2t=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};

/* 24-Stunden-Band: Segmente über Mitternacht werden geteilt */
function band(segs){
  const parts=[];segs.forEach(([a,b,cls,lbl])=>{if(a==null||b==null)return;a=((a%1440)+1440)%1440;b=((b%1440)+1440)%1440;if(a===b)return;
    if(b>a)parts.push([a,b,cls,lbl]);else{parts.push([a,1440,cls,lbl]);if(b>0)parts.push([0,b,cls,''])}});
  return `<div class="band" role="img" aria-label="${segs.filter(s=>s[0]!=null&&s[1]!=null).map(s=>s[3]+' '+m2t(s[0])+' bis '+m2t(s[1])).join(', ')}">
   ${parts.map(([a,b,cls,lbl])=>`<span class="seg-${cls}" style="left:${(a/14.4).toFixed(2)}%;width:${((b-a)/14.4).toFixed(2)}%"><em>${(b-a)>=150?lbl:''}</em></span>`).join('')}
   </div><div class="band-ax"><span>0</span><span>6</span><span>12</span><span>18</span><span>24 Uhr</span></div>`;
}

     ${dur!=null?`<div class="box ${dur>=420||k==='frei'?'ok':'tip'}">Schlafgelegenheit: <b>${durTxt(dur)}</b>${k==='frei'?' – danach wach bleiben und abends normal schlafen.':dur>=420?' – das reicht für die meisten Erwachsenen.':' – das ist weniger als die empfohlenen 7 Stunden. Ein kurzes Nickerchen kann einen Teil auffangen.'}</div>`:''}</div>
     <div class="card"><h2>Tipps für deinen ${S.name}</h2><ul class="stips">${shiftTips(k,T).map(t=>`<li>${t}</li>`).join('')}</ul>
     <p class="src">Die Etiketten zeigen, worauf ein Tipp beruht: <b>Studie</b> = durch Forschung gestützt · <b>Praxiswissen</b> = bewährt, aber kaum untersucht · <b>Einschätzung</b> = begründete Empfehlung ohne direkte Studie.</p></div>`;}
  if(sl.tab==='parken'){
    body=`<div class="card"><h2>Gedanken parken</h2><p>Was steht morgen oder in den nächsten Tagen an? Schreib es auf – <b>so konkret wie möglich</b>. Dann darf es bis morgen hier liegen bleiben.</p>
     <textarea id="sl-list" style="min-height:170px" placeholder="z. B.&#10;– Pflegeplanung für Frau M. bis Freitag fertig&#10;– Apotheke: Rezept abholen&#10;– Lernplan: 20 Min. Thema Atmung wiederholen">${esc(d.list)}</textarea>
     <div class="row"><button class="btn" id="sl-save">Speichern – gute Nacht</button><button class="btn small ghost" id="sl-copy">Kopieren</button><button class="btn small ghost" id="sl-clear">Liste leeren</button></div>
     ${d.listTs?`<p class="note">Zuletzt gespeichert: ${new Date(d.listTs).toLocaleString('de-DE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</p>`:''}
     <div class="box info">Fünf Minuten reichen. Es geht nicht darum, alles zu lösen – nur darum, es aus dem Kopf aufs Papier zu holen.</div>
     <div class="box warm">Wenn dich belastende Erlebnisse aus dem Dienst nicht loslassen, ist eine Liste oft nicht genug. Sprich darüber – mit Kolleginnen, deiner Praxisanleitung oder in der Supervision. Für den Moment: <button class="link" data-dtab="erdung">Erden</button> oder die <button class="link" data-dtab="hilfe">Hilfe-Karte</button>.</div>
     <p class="src">In einer Schlaflabor-Studie mit 57 jungen Erwachsenen schliefen diejenigen schneller ein, die vor dem Schlafen 5 Minuten eine To-do-Liste schrieben – schneller als die, die erledigte Aufgaben notierten. Je konkreter die Liste, desto schneller ging es (Scullin et al., 2018). Es war nur eine Nacht mit gesunden Studierenden – bei Schlafstörungen ist offen, ob es genauso wirkt.</p></div>`;}
  if(sl.tab==='lernen'){
    const now=new Date(),wake=new Date(now.getTime()+(sl.nap+10)*60000);
    body=`<div class="card"><h2>Was Schlaf fürs Lernen tut</h2>
     <p>Im Schlaf spielt dein Gehirn das Gelernte noch einmal ab: Der <b>Hippocampus</b> – eine Art Zwischenspeicher – reaktiviert die neuen Gedächtnisspuren, und sie werden nach und nach in die Netzwerke der <b>Großhirnrinde</b> eingebaut. Vor allem im Tiefschlaf wird so gefestigt, was du tagsüber gelernt hast (Diekelmann & Born, 2010).</p>
     <p>Und umgekehrt: Wer übermüdet lernt, speichert Neues deutlich schlechter ein – im Experiment war der Hippocampus nach einer durchwachten Nacht beim Einspeichern weniger aktiv (Yoo et al., 2007).</p>
     <div class="box ok"><b>Für dich heißt das:</b><ul class="plain"><li>Abends lieber 5 Minuten abrufen als bis spät in die Nacht pauken.</li><li>Vor einer Klausur nicht die Nacht durchlernen – Schlaf ist Teil des Lernens.</li><li>Nach dem Nachtdienst erst schlafen, dann lernen.</li></ul></div>
     <div class="row"><button class="btn small" data-go="abruf">Abend-Abruf starten</button><button class="btn small ghost" data-stab="parken">Gedanken parken</button></div></div>

     <div class="seg" role="group" aria-label="Nickerchen-Dauer">${[[20,'Kurz: 20 Min.'],[90,'Vorschlaf: 90 Min.']].map(([n,l])=>`<button data-nap="${n}" aria-pressed="${sl.nap===n}">${l}</button>`).join('')}</div>
     <div class="napout">Wecker stellen auf <b>${wake.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</b></div>
     <p class="note">${sl.nap===20?'Kurze Nickerchen machen wacher, ohne dass du lange benommen bist (Lovato & Lack, 2010).':'Ein längerer Schlaf eignet sich vor allem als Vorschlaf am Nachmittag vor dem Nachtdienst. Danach bist du oft erst einmal etwas benommen (Tassi & Muzet, 2000).'} Bitte stell deinen Handy-Wecker – die App kann dich bei ausgeschaltetem Bildschirm nicht zuverlässig wecken.</p></div>`;}
  if(sl.tab==='ehrlich'){
    body=`<div class="card"><h2>Was die Forschung sagt – und was nicht</h2>
     <ul class="stips">
      <li>${lv('s')} <b>Schlafhygiene-Regeln</b> (kein Koffein am Abend, regelmäßige Zeiten, ruhiges Zimmer …) hängen einzeln mit besserem Schlaf zusammen. Als Paket „beigebracht“ verbessern sie Schlafstörungen aber kaum (Irish et al., 2015). Sie sind ein guter Anfang, keine Behandlung.</li>
      <li>${lv('s')} <b>Schichtdienst:</b> Eine Cochrane-Übersicht fand zu Licht, Nickerchen und Schlafschulung nur wenige, sehr unterschiedliche Studien. Ob diese Strategien wirken, lässt sich noch nicht sicher sagen (Slanger et al., 2016).</li>
      <li>${lv('e')} <b>Keine starren Regeln:</b> „Immer zur gleichen Zeit ins Bett“ passt nicht zum Schichtdienst. Finde heraus, was bei dir funktioniert – Morgenmenschen und Abendmenschen kommen mit Früh- und Nachtdiensten unterschiedlich gut zurecht.</li>
      <li>${lv('s')} <b>Wenn du über Wochen schlecht schläfst</b>, sprich mit deiner Hausärztin. Bei Schlafstörungen ist eine kognitive Verhaltenstherapie für Insomnie (KVT-I) die Behandlung der ersten Wahl (Riemann et al., 2017) – und gut wirksam.</li>
     </ul>
     <div class="box lav">Schlaf lässt sich nicht erzwingen. Je mehr Druck („Ich MUSS jetzt schlafen“), desto wacher wird man oft. Es ist in Ordnung, einfach ruhig zu liegen – auch das ist Erholung.</div>
     <p class="src">Die letzte Aussage ist Erfahrungswissen aus der Schlafberatung und nicht direkt durch eine eigene Studie belegt.</p></div>`;}
  return head('Schlaf-Kompass','Gut schlafen im Schichtdienst','Früh, spät, nachts – dein Schlaf muss sich ständig anpassen. Hier findest du Tipps für deinen Dienstplan, einen Platz zum Gedanken-Parken und das Wissen, warum Schlaf fürs Lernen so wichtig ist.','erschoepft')+
   `<div class="chips" role="tablist" aria-label="Bereiche">${T0.map(([x,l])=>`<button class="chip" data-stab="${x}" aria-pressed="${sl.tab===x}">${l}</button>`).join('')}</div>`+body;

   ${E?(()=>{const c=counts(E),n=c[0]+c[1]+c[2];return n?`<div class="pbar"><span class="s2" style="width:${100*c[2]/n}%"></span><span class="s1" style="width:${100*c[1]/n}%"></span></div><div class="legend"><span><i style="background:var(--sage)"></i>${c[2]} sicher</span><span><i style="background:var(--gold)"></i>${c[1]} bearbeitet</span><span><i style="background:var(--line2)"></i>${c[0]} offen</span></div>`:''})():''}</div>`;

     ${nck===KCHK.length?'<div class="box ok">Alles bereit. Den Rest musst du heute nicht mehr tragen.</div>':''}
     <p class="src">Praxiswissen: Wer abends alles vorbereitet, hat morgens weniger zu entscheiden – und mehr Ruhe im Kopf.</p></div>
     <div class="card"><h2>Heute nur noch wiederholen</h2><p>Neues lernen bringt jetzt wenig. Besser: <b>10–15 Minuten locker abrufen</b>, was du schon kannst – dann Schluss.</p>
     ${wack.length?`<div class="today">${wack.map(x=>`<div class="it"><span>${esc(x.s.name)}<small>${esc(x.t.name)} · ${STAT[x.s.status||0]}</small></span><button class="mini" data-abr="${x.s.id}">Abrufen</button></div>`).join('')}</div>`:`<div class="row"><button class="btn small" data-go="abruf">Kurz abrufen</button></div>`}
     <p class="src">Abrufen festigt das Gelernte stärker als nochmaliges Lesen (Roediger & Karpicke, 2006).</p></div>
     <div class="card"><h2>Und dann: schlafen</h2><p>Im Schlaf festigt dein Gehirn, was du gelernt hast (Diekelmann & Born, 2010). Eine durchlernte Nacht schadet mehr, als sie nützt – übermüdet lässt sich Neues deutlich schlechter einspeichern (Yoo et al., 2007).</p>
     <div class="row"><button class="btn small" data-stab="parken">Gedanken parken</button><button class="btn small ghost" data-dtab="atem">Atem-Begleiter</button></div>
     <div class="box warm">Du kannst nicht einschlafen? Das ist vor Prüfungen ganz normal und kein Drama – eine unruhige Nacht verkraftet dein Körper. Ruhig liegen ist auch Erholung.</div>
     <p class="src">Der letzte Hinweis ist Erfahrungswissen; er soll Druck nehmen, nicht Schlaf ersetzen.</p></div>`;}
  if(kt.tab==='morgen'){
    body=`<div class="card"><h2>Ein ruhiger Start</h2><ul class="stips">
      <li>${lv('p')} <b>Frühstücken und trinken</b> – auch wenn der Magen flattert: etwas Kleines reicht.</li>
      <li>${lv('p')} <b>Mit Puffer losgehen.</b> Lieber 15 Minuten zu früh als gehetzt ankommen.</li>
      <li>${lv('e')} <b>Kein neues Thema mehr anfangen.</b> Wenn du magst: ein kurzes Aufwärmen – zu jedem Thema drei Stichworte aus dem Kopf aufschreiben.</li>
      <li>${lv('s')} <b>Du hast mit Abrufen gelernt?</b> Gut so: In einer Studie konnten Menschen, die mit Abrufübungen gelernt hatten, ihr Wissen auch unter akutem Stress gut abrufen – anders als die, die nur wiederholt gelesen hatten (Smith et al., 2016).</li></ul>
     <div class="row"><button class="btn small" data-dtab="atem">1 Minute durchatmen</button><button class="btn small ghost" data-kttab="vorher">Weiter: In der Klausur</button></div></div>`;}
  if(kt.tab==='vorher'){
    body=`<div class="card"><h2>Aufregung ist Energie</h2>
     <div class="kind" style="font-size:1.1rem">„Mein Herz klopft, weil mein Körper Energie bereitstellt. Ich bin bereit.“</div>
     <p>Herzklopfen, schnellerer Atem, flaues Gefühl: Das ist dein Körper, der sich auf eine Herausforderung vorbereitet – kein Zeichen, dass du versagst. Diese Deutung auszuprobieren, kann helfen.</p>
     <p class="src">Eine Meta-Analyse über 44 Effektgrößen aus randomisierten Studien fand: Wer Stress-Erregung als hilfreich umdeutet, schneidet im Schnitt etwas besser ab – der Effekt ist klein (d = 0,23; Bosshard & Gomez, 2024). Es lohnt sich, aber es ist kein Wundermittel.</p>
     <div class="box warm">Etwas Aufregung ist normal. Starke Prüfungsangst hängt dagegen mit schlechteren Leistungen zusammen (kleiner bis mittlerer Effekt in einer Meta-Analyse über 238 Studien; von der Embse et al., 2018). Wenn dich die Angst schon Tage vorher stark belastet: Sprich mit deiner Lehrkraft oder Schulsozialarbeit – dagegen lässt sich etwas tun.</div></div>
     <div class="card"><h2>So gehst du die Klausur an</h2><ol class="steps">
      <li><span><b>Erst alles überfliegen.</b> Wie viele Aufgaben, wie viele Punkte? Teil deine Zeit grob nach Punkten ein.</span></li>
      <li><span><b>Operatoren markieren.</b> „Nennen“ will etwas anderes als „erläutern“ oder „beurteilen“. Unterstreiche das Verb, bevor du schreibst.</span></li>
      <li><span><b>Mit etwas Leichtem beginnen.</b> Ein sicherer Einstieg beruhigt und bringt Punkte.</span></li>
      <li><span><b>Hängen geblieben?</b> Stichworte notieren, Aufgabe markieren, weitermachen – später zurückkommen.</span></li>
      <li><span><b>Am Ende:</b> Hast du alle Aufgaben gesehen? Passt die Antwort zum Operator?</span></li></ol>
     <p class="src">Praxiswissen aus der Prüfungsvorbereitung. Die Operatoren entsprechen den Anforderungsbereichen I–III eurer Schule, angelehnt an die Taxonomie nach Bloom (Bloom et al., 1956; Anderson & Krathwohl, 2001) – mehr dazu bei der <button class="link" data-go="ki">Probeklausur mit KI</button>.</p></div>
     <div class="card sos"><h2>Blackout? Notfallkarte</h2><ol class="steps">
      <li><span><b>Stift hinlegen.</b> Du darfst kurz pausieren.</span></li>
      <li><span><b>Dreimal lang ausatmen</b> – länger aus als ein.</span></li>
      <li><span><b>Füße auf den Boden drücken</b>, den Stuhl spüren, einmal umschauen.</span></li>
      <li><span><b>Irgendein Stichwort</b> zur Aufgabe aufschreiben – egal wie klein. Daran hängt oft der Rest.</span></li>
      <li><span>Geht gar nichts: <b>nächste Aufgabe</b>. Das Wissen ist nicht weg, nur gerade schwer erreichbar.</span></li></ol>
     <p class="src">Praxiswissen. Unter starkem Stress fällt das Abrufen schwerer; der Blick nach außen und langes Ausatmen helfen vielen, wieder anzukommen (vgl. Durchatmen).</p></div>
     <details class="card"><summary><b>Sorgen vorher aufschreiben?</b> <span class="note">– ehrlich eingeordnet</span></summary>
      <p>Manche schreiben vor der Klausur zehn Minuten lang auf, was sie beunruhigt. In einer bekannten Studie verbesserte das die Leistung prüfungsängstlicher Schülerinnen und Schüler (Ramirez & Beilock, 2011). Eine große Wiederholungsstudie konnte das Ergebnis aber <b>nicht bestätigen</b> (Camerer et al., 2018).</p>
      <p>Wenn es dir guttut: probier es gern. Wenn nicht: Du verpasst nichts Wichtiges.</p></details>`;}
  if(kt.tab==='danach'){
    const R=d.refl.slice().reverse(),rf=kt.rf;
    body=`<div class="card"><h2>Erst mal: geschafft.</h2><p>Egal, wie es gelaufen ist – du hast dich hingesetzt und es durchgezogen. Gönn dir eine Pause, bevor du zurückschaust. Die Reflexion kann auch morgen sein.</p></div>

       <div class="chips" style="margin-top:8px">${KATTR.map(([k,l])=>`<button class="chip" data-attr="${k}" aria-pressed="${rf.attr.includes(k)}">${l}</button>`).join('')}</div></div>
      <div class="attrfb" id="kt-fb" aria-live="polite">${attrFb()}</div>

      <div class="row"><button class="btn" id="kt-save">Rückblick speichern</button></div>
      <p class="src">Ob wir Erfolg und Misserfolg auf veränderbare oder feste Ursachen zurückführen, beeinflusst Gefühle und Motivation für das nächste Mal (Weiner, 1979). Ehrlich: Ein Rückblick-Bogen allein verbesserte in einer Studie weder Noten noch Metakognition (Soicher & Gurung, 2017). Er wirkt erst, wenn du deinen Vorsatz auch in den Lernplan übernimmst.</p></div>
     ${R.length?`<div class="card"><h3>Deine Rückblicke</h3><div class="hist">${R.slice(0,8).map(r=>`<div class="h"><b>${esc(r.name)}</b><span class="note">${new Date(r.ts).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'2-digit'})}${r.note?' · '+esc(r.note):''}</span><span class="note" style="grid-column:1/-1">${r.mit?'Vorsatz: „'+esc(r.mit)+'“':'ohne Vorsatz'}</span></div>`).join('')}</div>
      <div class="row"><button class="btn small ghost" data-go="plan">Vorsatz im Lernplan umsetzen</button></div></div>`:''}`;}

 {id:'b1',n:1,t:'Ankommen & Lernbiografie',c:'rose',q:[
  [1,'Nenne zwei Unterschiede zwischen dem Lernen in der Schule und dem Lernen in der Pflegeausbildung.','Zum Beispiel: Du lernst an zwei Lernorten (Schule und Praxis), die zusammenhängen. Du organisierst dein Lernen viel selbstständiger. Und du lernst für die Versorgung echter Menschen – nicht nur für Noten.'],

  [2,'Erläutere den Unterschied zwischen „Lernen müssen“ und „Lernen wollen“.','„Müssen“ kommt von außen (Druck, Noten), „Wollen“ von innen (Interesse, Sinn). Motivation von innen wird gestärkt, wenn du selbst mitentscheiden kannst, dich kompetent erlebst und dich verbunden fühlst (Deci & Ryan).'],
  [3,'Beschreibe eine Lernerfahrung, die dir geholfen hat, und leite daraus eine Strategie für die Ausbildung ab.','Deine eigene Antwort. Beispiel: „Im Abi hat mir Lernen mit einer Freundin geholfen“ → „Ich verabrede mich einmal pro Woche mit meinem Tandem zum gegenseitigen Abfragen.“']]},
 {id:'b2',n:2,t:'Lernumgebung & Arbeitsplatz',c:'peach',q:[
  [1,'Nenne vier Merkmale eines lernförderlichen Arbeitsplatzes.','Zum Beispiel: ruhig, aufgeräumt, gutes Licht, Material griffbereit, etwas zu trinken – und das Handy außer Sichtweite.'],
  [2,'Erkläre, warum das Handy am besten in einem anderen Raum liegt.','Jede Benachrichtigung unterbricht, und nach jeder Unterbrechung brauchst du Zeit, um wieder reinzukommen. Liegt das Handy außer Sicht, musst du der Versuchung nicht ständig widerstehen.'],
  [2,'Mythos oder Fakt: „Musik hilft immer beim Lernen.“ Begründe.','Eher Mythos. Vor allem Musik mit Gesang kann beim Lesen und Auswendiglernen stören. Ob leise Instrumentalmusik hilft, ist individuell verschieden – probier es bewusst aus.'],
  [3,'Formuliere einen Wenn-dann-Plan für deinen Lernplatz.','Zum Beispiel: „Wenn ich mich zum Lernen an den Schreibtisch setze, dann lege ich mein Handy in die Küche.“ Wichtig: konkrete Situation + konkrete Handlung.']]},
 {id:'b3',n:3,t:'Wahrnehmung & Aufmerksamkeit',c:'sky',q:[
  [1,'Nenne die Stationen vom Reiz bis zum Handeln.','Reiz → Sinnesorgan nimmt ihn auf → Weiterleitung über Nerven → Verarbeitung im Gehirn (auswählen, deuten, mit Bekanntem verknüpfen) → Reaktion bzw. Handeln.'],
  [2,'Erkläre, was das Gorilla-Experiment zeigt.','Unaufmerksamkeitsblindheit: Was nicht im Fokus unserer Aufmerksamkeit liegt, nehmen wir oft gar nicht bewusst wahr – selbst wenn es auffällig ist.'],
  [2,'Erkläre, warum Multitasking beim Lernen Zeit und Fehler kostet.','Die Aufmerksamkeit ist begrenzt. Beim „Multitasking“ springen wir in Wahrheit hin und her. Jeder Wechsel kostet Zeit und macht fehleranfälliger.'],
  [2,'Beschreibe den Cocktailparty-Effekt.','Wir können uns auf ein Gespräch konzentrieren und andere ausblenden (selektive Aufmerksamkeit). Trotzdem bemerken wir es, wenn jemand im Hintergrund unseren Namen sagt – Bedeutsames wird unbewusst mitverarbeitet.'],
  [3,'Übertrage es auf die Pflege: Wo kann Unaufmerksamkeit gefährlich werden – und was hilft?','Zum Beispiel beim Richten von Medikamenten, wenn man ständig unterbrochen wird. Hilfreich: ungestörte Zeiten oder Bereiche, Checklisten, Vier-Augen-Prinzip, eine Aufgabe nach der anderen.']]},
 {id:'b4',n:4,t:'Fokus, Gefühle & Balance',c:'sage',q:[

  [2,'Erkläre, warum es hilft, ein Gefühl in Worte zu fassen.','Ein Gefühl zu benennen („Ich bin gerade angespannt“), kann die emotionale Reaktion bereits etwas dämpfen. Das schafft Abstand, um zu entscheiden, was jetzt hilft (Lieberman et al., 2007).'],
  [2,'Erkläre, warum Schlaf zum Lernen gehört.','Im Schlaf werden neu gelernte Inhalte gefestigt: Der Hippocampus reaktiviert sie, und sie werden in die Netzwerke der Großhirnrinde eingebaut (Diekelmann & Born, 2010).'],
  [2,'Begründe, warum feste Pausen beim Lernen sinnvoll sind.','Die Konzentration lässt mit der Zeit nach. Kurze, feste Pausen – am besten mit Bewegung und ohne Handy – helfen, über längere Zeit aufmerksam zu bleiben.'],
  [3,'Entwickle ein Lernstart-Ritual aus drei Schritten.','Deine eigene Antwort. Beispiel: 1. Handy in einen anderen Raum, 2. Ziel für diese Einheit aufschreiben, 3. einmal lang ausatmen und den Timer starten.']]},
 {id:'b5',n:5,t:'Gedächtnis & Lerntypen-Mythos',c:'lav',q:[

  [1,'Nenne die Schritte von TQ3L.','Tune in (einstimmen), Question (Fragen stellen), Look (hinschauen), Listen (zuhören), Look again (rückblickend durchsehen).'],
  [2,'Beschreibe die Vergessenskurve und was dagegen hilft.','Kurz nach dem Lernen vergessen wir sehr schnell, danach langsamer. Verteilte Wiederholungen – am besten aus dem Kopf – „stocken“ die Kurve wieder auf und machen sie flacher.'],
  [2,'Erkläre, warum Abrufen wirksamer ist als nochmaliges Lesen.','Beim Abrufen wird die Erinnerung aktiv neu aufgebaut. Das festigt die Gedächtnisspur und die Abrufwege. Und du siehst ehrlich, was du noch nicht kannst (Roediger & Karpicke, 2006).'],
  [3,'Beurteile die Aussage: „Ich bin ein visueller Lerntyp, also muss ich mir nur Bilder ansehen.“','Vorlieben gibt es, aber Unterricht passend zum „Lerntyp“ führt nicht zu besseren Ergebnissen (Pashler et al., 2008). Für alle hilft: Wort und Bild verbinden und den Stoff so darstellen, wie es zum Inhalt passt.'],
  [3,'Plane die Wiederholungen für ein Thema, das du heute gelernt hast.','Zum Beispiel: nach 1, 3 und 7 Tagen jeweils ein paar Minuten aus dem Kopf abrufen, danach vergleichen. Der Abruf-Bereich der App plant das für dich.']]},
 {id:'b6',n:6,t:'Lernmethoden-Werkstatt',c:'gold',q:[

  [2,'Erkläre, warum Markieren allein wenig bringt.','Markieren fühlt sich nach Lernen an, verarbeitet den Stoff aber kaum. Wirksamer: sparsam markieren und danach etwas damit tun – Fragen beantworten, zusammenfassen, abrufen (Dunlosky et al., 2013).'],
  [2,'Erkläre, wie du Karteikarten am wirksamsten nutzt.','Vorderseite Frage, Rückseite Antwort. Erst aus dem Kopf antworten, dann umdrehen. Verteilt wiederholen (z. B. Lernkartei) und auch Karten, die du schon kannst, nicht zu früh aussortieren.'],
  [2,'Erläutere den Unterschied zwischen Mind-Map und Zusammenfassung.','Die Mind-Map zeigt Struktur und Zusammenhänge vom Zentrum aus, in Stichworten. Die Zusammenfassung gibt den Inhalt in eigenen Worten und in einer Reihenfolge wieder.'],
  [2,'Erkläre, warum Sketchnotes beim Behalten helfen können.','Beim Zeichnen verbindest du Wort und Bild und musst den Inhalt dafür verarbeiten. In Studien wurden gezeichnete Begriffe besser erinnert als nur aufgeschriebene (Wammes et al., 2016).'],
  [3,'Wähle für das Thema Dekubitusprophylaxe eine passende Methode und begründe deine Wahl.','Zum Beispiel: Mind-Map für den Überblick über Risikofaktoren und Maßnahmen, danach Karteikarten zum Abfragen der Details. Entscheidend ist, dass die Methode zu deinem Ziel passt (Überblick, Verstehen oder Behalten).']]},
 {id:'b7',n:7,t:'Versagensangst & Aufschieben',c:'rose',q:[

  [2,'Erkläre, warum wir aufschieben.','Meist nicht aus Faulheit: Aufschieben ist oft ein Versuch, unangenehme Gefühle kurzfristig zu vermeiden – zum Preis von mehr Stress später (Sirois & Pychyl, 2013).'],
  [2,'Erkläre, warum es hilft, sich das Aufschieben zu verzeihen.','Wer sich nach dem Aufschieben verzeiht, schiebt beim nächsten Mal weniger auf – Selbstvorwürfe halten dagegen die unangenehmen Gefühle am Leben (Wohl et al., 2010).'],
  [2,'Erkläre, wie ein Wenn-dann-Plan funktioniert.','Du legst vorher fest: In Situation X mache ich Y. Die Situation wird dann zum Startsignal, und du musst nicht jedes Mal neu entscheiden (Gollwitzer & Sheeran, 2006).'],
  [3,'Formuliere einen 5-Minuten-Start für eine Aufgabe, die du gerade aufschiebst.','Deine eigene Antwort. Beispiel: „Ich öffne heute um 17 Uhr das Skript, lese die Überschriften von Kapitel 3 und schreibe drei Fragen dazu auf.“']]},
 {id:'b8',n:8,t:'Klausurvorbereitung',c:'sky',q:[

/* Link-Kodierung: JSON → (deflate) → base64url. Fragen stecken nur im Link, nichts wird auf einem Server gespeichert. */
const b64u=u8=>{let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function packEncode(o){const raw=new TextEncoder().encode(JSON.stringify(o));
  try{if('CompressionStream' in window){const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));const z=new Uint8Array(await new Response(cs).arrayBuffer());if(z.length<raw.length)return 'z'+b64u(z)}}catch(e){}
  return 'j'+b64u(raw)}
async function packDecode(s){const k=s[0],u=ub64(s.slice(1));let raw=u;
  if(k==='z'){if(!('DecompressionStream' in window))throw new Error('alt');const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));raw=new Uint8Array(await new Response(ds).arrayBuffer())}
  const o=JSON.parse(new TextDecoder().decode(raw));
  if(!o||!Array.isArray(o.q))throw new Error('format');
  return {t:String(o.t||'Fragen von deinem Tandem').slice(0,80),q:o.q.slice(0,12).map(x=>[Math.min(3,Math.max(1,+x[0]||1)),String(x[1]||'').slice(0,240),String(x[2]||'').slice(0,400)]).filter(x=>x[1].trim())}}

function weekStats(){
  const t1=Date.now(),t0=t1-7*864e5;
  const ev=evals().filter(e=>e.ts>=t0),mins=ev.reduce((a,e)=>a+(+e.dauer||0),0);
  const ent=entries(),newAb=ent.filter(e=>e.created>=today0()-6*864e5).length;
  const revs=ent.reduce((a,e)=>a+(e.hist||[]).filter(x=>x>=t0).length,0);
  const due=dueList().length;
  const subs=allSubs().filter(x=>x.s.last&&x.s.last>=t0).length;
  const up=plan().exams.filter(e=>daysTo(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const byM={};ev.forEach(e=>{if(!e.method)return;(byM[e.method]=byM[e.method]||[]).push(e)});
  const best=Object.entries(byM).map(([k,l])=>[k,l.reduce((a,e)=>a+e.eff,0)/l.length,l.length]).sort((a,b)=>b[1]-a[1])[0];
  const kr=kdat().refl.filter(r=>r.ts>=t0).length;
  return {ev:ev.length,mins,newAb,revs,due,subs,up,best,kr};
}
function weekTips(S){const t=[];
  if(S.due)t.push(`${S.due} ${S.due===1?'Wiederholung ist':'Wiederholungen sind'} offen – plane sie gleich am Anfang der Woche ein, je 5 Minuten reichen.`);
  if(S.up[0]){const e=S.up[0],c=counts(e),open=c[0]+c[1],d=daysTo(e.date);if(open&&d<=21)t.push(`„${esc(e.name)}“ ist in ${d} ${d===1?'Tag':'Tagen'}: Noch ${open} ${open===1?'Unterthema':'Unterthemen'} nicht sicher – das sind etwa ${Math.ceil(open/Math.max(1,d-1))} pro Tag.`)}
  if(S.best&&S.best[2]>=2)t.push(`Am wirksamsten fandest du diese Woche: <b>${esc(MBY[S.best[0]]?MBY[S.best[0]].name:'deine Methode')}</b> (Wirkung ${f1(S.best[1])} von 5). Behalte sie bei.`);
  if(!S.ev&&!S.newAb&&!S.revs)t.push('Diese Woche hast du noch nichts eingetragen. Kein Problem – starte mit einer einzigen kleinen Lerneinheit.');
  return t}

const FT={focus:25,brk:5,phase:'idle',end:0,sec:1,round:0,id:null,task:''};
const CIRC=2*Math.PI*54;
function ftLive(){const b=document.querySelector('#tabs [data-tab=timer]');if(b)b.classList.toggle('live',FT.phase!=='idle')}
function ftPaint(r){const c=$('#ft-clock');if(!c)return;c.textContent=fmt(FT.phase==='idle'?FT.focus*60:r);
  const bar=$('#ft-bar');if(bar)bar.style.strokeDashoffset=FT.phase==='idle'?CIRC:CIRC*(Math.max(0,r)/FT.sec);
  const L=$('#ft-label');if(L)L.textContent=FT.phase==='focus'?(FT.task?'Fokus: '+FT.task:'Fokus – eine Sache'):FT.phase==='break'?'Pause – aufstehen, trinken, Blick in die Ferne':'Bereit';
  const im=$('#ft-img');if(im)im.hidden=FT.phase!=='break';c.hidden=FT.phase==='break'&&false;
  const eb=$('#ft-eval');if(eb)eb.hidden=!FT.round;
  const n=$('#ft-round');if(n)n.textContent=FT.round?`${FT.round} ${FT.round===1?'Runde':'Runden'} geschafft`:'Noch keine Runde';
  const sb=$('#ft-start');if(sb)sb.textContent=FT.phase==='idle'?'Fokus starten':'Neu starten';
  c.classList.toggle('warn',FT.phase==='focus'&&r<=10)}
function ftTick(){const r=(FT.end-Date.now())/1000;ftPaint(r);if(r<=0){if(FT.phase==='focus'){FT.round++;gong(1);toast('Pause! Kurz aufstehen.');ftStart('break')}else{gong(2);toast('Weiter geht’s – nächste Runde.');ftStart('focus')}}}
function ftStart(ph){FT.phase=ph;FT.sec=(ph==='focus'?FT.focus:FT.brk)*60;FT.end=Date.now()+FT.sec*1000;clearInterval(FT.id);FT.id=setInterval(ftTick,250);wake(true);ftLive();ftTick()}
function ftStop(){clearInterval(FT.id);FT.id=null;FT.phase='idle';wake(false);ftLive();ftPaint(0)}

  `<div class="card" style="align-items:center;text-align:center">
